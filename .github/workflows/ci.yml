name: CI

on:
  push:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  checks:
    runs-on: ubuntu-latest
    services:
      # Integration tests (tests/integration) run against a real Postgres.
      postgres:
        image: postgres:17.5@sha256:aadf2c0696f5ef357aa7a68da995137f0cf17bad0bf6e1f17de06ae5c769b302
        env:
          POSTGRES_DB: vnclimate
          POSTGRES_USER: vnclimate
          POSTGRES_PASSWORD: ci-postgres
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U vnclimate -d vnclimate"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
      # S3-compatible stand-in for MinIO (a service container cannot pass
      # MinIO its `server` command).
      s3:
        image: motoserver/moto:5.2.3
        ports:
          - 9000:5000
    env:
      POSTGRES_USER: vnclimate
      POSTGRES_PASSWORD: ci-postgres
      MINIO_ACCESS_KEY: ci-minio
      MINIO_SECRET_KEY: ci-minio-password
      AIRFLOW_USERNAME: admin
      AIRFLOW_PASSWORD: ci-airflow
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2

      - name: Install uv and Python
        uses: astral-sh/setup-uv@v10.0.1
        with:
          enable-cache: true
          python-version: "3.13"
          version: "0.12.6"

      - name: Install dependencies
        run: uv sync --locked --all-groups

      - name: Ruff
        run: uv run ruff check .

      - name: Pytest
        run: uv run pytest

      - name: Validate documentation links
        run: uv run python scripts/check_docs.py

      - name: Validate Docker Compose
        run: docker compose config --quiet

      - name: Resolve dbt dependencies
        working-directory: transform
        run: uv run dbt deps --profiles-dir .

      - name: Parse the complete dbt project
        working-directory: transform
        run: uv run dbt parse --profiles-dir . --no-partial-parse

      # Use an empty local catalog so dbt compile stays service-free.
      - name: Prepare service-free dbt catalogs
        run: |
          mkdir -p /tmp/vn-climate-dbt-ci
          uv run python - <<'PY'
          import duckdb

          catalogs = {
              "/tmp/vn-climate-dbt-ci/catalog1.duckdb": ("seed", "silver", "gold"),
          }
          for path, schemas in catalogs.items():
              connection = duckdb.connect(path)
              for schema in schemas:
                  connection.execute(f"CREATE SCHEMA IF NOT EXISTS {schema}")
              connection.close()
          PY
          cat > /tmp/vn-climate-dbt-ci/profiles.yml <<'YAML'
          transform:
            target: ci
            outputs:
              ci:
                type: duckdb
                path: /tmp/vn-climate-dbt-ci/main.duckdb
                attach:
                  - path: /tmp/vn-climate-dbt-ci/catalog1.duckdb
                    alias: catalog1
          YAML

      # Compile SQL/Jinja here; service-backed execution runs elsewhere.
      - name: Compile the complete dbt project
        working-directory: transform
        run: uv run dbt compile --profiles-dir /tmp/vn-climate-dbt-ci --target ci

      - name: Build reproducible runtime images
        run: docker compose build airflow streamlit

      - name: Parse DAGs in the runtime image
        run: |
          docker compose run --rm --no-deps --entrypoint python airflow - <<'PY'
          from airflow.models.dagbag import DagBag

          dagbag = DagBag('/opt/airflow/dags', include_examples=False)
          assert not dagbag.import_errors, dagbag.import_errors
          assert set(dagbag.dags) == {
              'lakehouse_maintenance_daily',
              'open_meteo_archive_monthly',
              'open_meteo_forecast_hourly',
          }
          PY
