name: CI

on:
  push:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  checks:
    runs-on: ubuntu-latest
    env:
      AIRFLOW_SECRET_KEY: ci-airflow-secret-not-for-production
      MINIO_SECRET_KEY: ci-minio-secret-not-for-production
      PGADMIN_DEFAULT_PASSWORD: ci-pgadmin-password-not-for-production
      POSTGRES_PASSWORD: ci-postgres-password-not-for-production
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2

      - name: Install uv and Python
        uses: astral-sh/setup-uv@v10.0.1
        with:
          enable-cache: true
          python-version: "3.13"
          version: "0.12.6"

      - name: Install dependencies
        run: uv sync --locked --all-groups

      - name: Ruff
        run: uv run ruff check .

      - name: Pytest
        run: uv run pytest

      - name: Validate documentation links
        run: uv run python scripts/check_docs.py

      - name: Validate Docker Compose
        run: docker compose config --quiet

      - name: Resolve dbt dependencies
        working-directory: transform
        run: uv run dbt deps --profiles-dir .

      - name: Parse the complete dbt project
        working-directory: transform
        run: uv run dbt parse --profiles-dir . --no-partial-parse

      # dbt compile primes the adapter cache and therefore opens every attachment
      # before applying node selection. A local empty catalog preserves the
      # production alias while keeping compilation independent of PostgreSQL and
      # MinIO. Một catalog kể từ 2026-09-03 (bỏ bronze_store và pg_source).
      - name: Prepare service-free dbt catalogs
        run: |
          mkdir -p /tmp/vn-climate-dbt-ci
          uv run python - <<'PY'
          import duckdb

          catalogs = {
              "/tmp/vn-climate-dbt-ci/catalog1.duckdb": ("seed", "silver", "gold"),
          }
          for path, schemas in catalogs.items():
              connection = duckdb.connect(path)
              for schema in schemas:
                  connection.execute(f"CREATE SCHEMA IF NOT EXISTS {schema}")
              connection.close()
          PY
          cat > /tmp/vn-climate-dbt-ci/profiles.yml <<'YAML'
          transform:
            target: ci
            outputs:
              ci:
                type: duckdb
                path: /tmp/vn-climate-dbt-ci/main.duckdb
                attach:
                  - path: /tmp/vn-climate-dbt-ci/catalog1.duckdb
                    alias: catalog1
          YAML

      # Compile validates SQL/Jinja for the full project. Fixture-backed dbt tests
      # are intentionally not run against these empty catalogs: model execution uses
      # DuckLake materializations/hooks and belongs to the service-backed build.
      - name: Compile the complete dbt project
        working-directory: transform
        run: uv run dbt compile --profiles-dir /tmp/vn-climate-dbt-ci --target ci

      - name: Build reproducible runtime images
        run: docker compose build airflow dashboard

      - name: Parse DAGs in the runtime image
        run: |
          docker compose run --rm --no-deps airflow python - <<'PY'
          from airflow.models.dagbag import DagBag

          dagbag = DagBag('/opt/airflow/dags', include_examples=False)
          assert not dagbag.import_errors, dagbag.import_errors
          assert set(dagbag.dags) == {
              'lakehouse_maintenance_daily',
              'open_meteo_archive_monthly',
              'open_meteo_forecast_hourly',
          }
          PY
