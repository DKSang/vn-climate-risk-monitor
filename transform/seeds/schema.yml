version: 2

seeds:
  - name: ward_grid_map_seed
    description: >
      Ánh xạ phường → ô lưới cho từng model archive, lấy từ CHÍNH phép snap của
      Open-Meteo (sinh bởi `uv run fetch-open-meteo map-grid --execute`, không phải tính nearest-neighbour —
      hai cách này lệch nhau).
      Đây là thứ cho phép fetch theo ô thay vì theo phường: 126 phường Hà Nội chỉ
      rơi vào 12 ô ERA5 với dữ liệu giống hệt nhau, nên fetch theo phường tiêu
      quota gấp ~10 lần mà không thêm thông tin.
    columns:
      - name: model
        description: "era5 (0,25°) hoặc ecmwf_ifs (~9km, từ 2017)"
        tests: [not_null]
      - name: ward_code
        tests: [not_null]
      - name: grid_latitude
        tests: [not_null]
      - name: grid_longitude
        tests: [not_null]

  - name: ward_coordinates_seed
    description: >
      Toạ độ centroid 3.321 phường/xã Việt Nam sau sắp xếp 2025, kèm vùng địa lý
      và đới khí hậu. File tĩnh, version-control cùng code, chỉ đổi khi có nghị
      quyết sắp xếp đơn vị hành chính mới.
      Zero-padding của mã hành chính được bảo vệ bởi test assert_seed_codes_zero_padded.
    columns:
      - name: location_key
        description: "Khoá thay thế, duy nhất trên toàn file"
        tests: [unique, not_null]
      - name: province_code
        description: "Mã tỉnh 2 ký tự, ĐÃ zero-pad ('01' = Hà Nội)"
        tests: [not_null]
      - name: commune_code
        description: "Mã phường/xã 5 ký tự, ĐÃ zero-pad ('00004')"
        tests: [unique, not_null]
      - name: latitude
        tests: [not_null]
      - name: longitude
        tests: [not_null]
