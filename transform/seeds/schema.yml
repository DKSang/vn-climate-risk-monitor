version: 2

seeds:
  - name: ward_grid_map_seed
    description: >
      Ánh xạ phường → ô lưới cho từng model archive, lấy từ CHÍNH phép snap của
      Open-Meteo (sinh bởi `make map-grid`, không phải tính nearest-neighbour —
      hai cách này lệch nhau).
      Đây là thứ cho phép fetch theo ô thay vì theo phường: 126 phường Hà Nội chỉ
      rơi vào 12 ô ERA5 với dữ liệu giống hệt nhau, nên fetch theo phường tiêu
      quota gấp ~10 lần mà không thêm thông tin.
    columns:
      - name: model
        description: "era5 (0,25°) hoặc ecmwf_ifs (~9km, từ 2017)"
        tests: [not_null]
      - name: ward_code
        tests: [not_null]
      - name: grid_latitude
        tests: [not_null]
      - name: grid_longitude
        tests: [not_null]

  - name: ward_coordinates_seed
    description: >
      Toạ độ centroid 3.321 phường/xã Việt Nam sau sắp xếp 2025, kèm vùng địa lý
      và đới khí hậu. File tĩnh, version-control cùng code, chỉ đổi khi có nghị
      quyết sắp xếp đơn vị hành chính mới.
      Zero-padding của mã hành chính được bảo vệ bởi test assert_seed_codes_zero_padded.
    columns:
      - name: location_key
        description: "Khoá thay thế, duy nhất trên toàn file"
        tests: [unique, not_null]
      - name: province_code
        description: "Mã tỉnh 2 ký tự, ĐÃ zero-pad ('01' = Hà Nội)"
        tests: [not_null]
      - name: commune_code
        description: "Mã phường/xã 5 ký tự, ĐÃ zero-pad ('00004')"
        tests: [unique, not_null]
      - name: latitude
        tests: [not_null]
      - name: longitude
        tests: [not_null]

  - name: flood_event_observations_seed
    description: >
      Quan sát ngập THỰC TẾ, sinh bởi `make fetch-flood-observations` từ bảng
      Flourish nhúng trong bài tường thuật VnExpress ngày 07/10/2025.
      Khác `hanoi_flood_points_seed`: file đó là DANH MỤC điểm có nguy cơ theo
      QĐ 2280, file này là BẰNG CHỨNG một địa điểm đã ngập vào một thời điểm.

      Không sửa tay. Mọi dòng gắn với đúng một `source_visualisation_version`;
      script từ chối ghi nếu version Flourish đổi mà chưa được review.

      GIỚI HẠN NHÃN — 122/123 dòng là nhãn dương. Đây là danh sách điểm ĐANG
      ngập, nên nó đo được recall (POD) nhưng KHÔNG đo được FAR hay CSI: luật
      "báo động mọi nơi" cũng đạt POD = 1,0 trên tập này. Vắng mặt trong bài báo
      KHÔNG phải bằng chứng không ngập — báo chí chỉ đăng điểm nổi bật. Nhãn âm
      đáng tin phải đến từ danh sách toàn thành phố của cơ quan chức năng.
    columns:
      - name: observation_id
        description: "Khoá quan sát, ví dụ VNE_20251007_001"
        tests: [unique, not_null]
      - name: event_id
        description: "Gom các quan sát cùng một trận mưa"
        tests: [not_null]
      - name: location_name_raw
        description: "Địa điểm ĐÚNG NGUYÊN VĂN nguồn; chưa gắn được phường"
        tests: [not_null]
      - name: observed_at_local
        description: >
          ISO-8601 kèm offset +07:00, suy từ cụm "lúc 6h30" trong cột lưu thông.
          RỖNG khi nguồn không ghi giờ — không được đoán.
      - name: is_flooded
        description: "false chỉ khi nguồn ghi rõ nước đã rút"
        tests: [not_null]
      - name: traffic_status
        tests:
          - not_null
          - accepted_values:
              values: ['receded', 'passable', 'slow', 'diverted', 'impassable', 'unknown']
      - name: source_grade
        description: >
          A = báo cáo Sở Xây dựng/Ban Duy tu; B = báo chí dẫn nguyên bảng chính
          thức; C = bài báo có ảnh, thời gian và địa điểm cụ thể;
          D = mạng xã hội hoặc phản ánh chưa xác minh.
        tests:
          - not_null
          - accepted_values:
              values: ['A', 'B', 'C', 'D']
      - name: source_url
        tests: [not_null]
      - name: source_visualisation_version
        description: "Version Flourish — đổi số này là đổi nội dung nguồn"
        tests: [not_null]

  - name: flood_observation_geocode_seed
    description: >
      Toạ độ và phường cho từng quan sát ngập. Sinh nháp bởi
      `make geocode-flood-observations` (Nominatim + point-in-polygon trên 126
      ranh giới ở `reference/s13_wards/`), sau đó NGƯỜI soát.

      Tách khỏi `flood_event_observations_seed.csv` vì file đó do máy sinh và bị
      ghi đè mỗi lần fetch lại; gộp chung thì công soát tay mất sạch.

      `geocode_verified` là cổng duy nhất: chỉ dòng `true` mới vào
      `is_training_eligible`. Script LUÔN ghi `false` và không bao giờ tự đổi
      thành `true` — gán sai phường nghĩa là sai ô lưới, sai lượng mưa, nhãn
      hỏng, mà nhãn hỏng tệ hơn thiếu nhãn.

      Đọc `geocode_match_type` khi soát:
        full_name     — khớp cả cụm mô tả, đáng tin nhất
        road_prefix   — CHỈ khớp tên tuyến, trả điểm đại diện của cả tuyến.
                        Đo được: Km14+500 và Km17+700 Quốc lộ 32, cách nhau
                        ~3 km thực địa, nhận CÙNG một toạ độ. Phải chỉnh tay.
        outside_hanoi — có toạ độ nhưng rơi ngoài 126 phường
        no_match      — Nominatim không trả kết quả nào
    columns:
      - name: observation_id
        tests:
          - unique
          - not_null
          - relationships:
              to: ref('flood_event_observations_seed')
              field: observation_id
      - name: ward_code
        description: "Suy từ point-in-polygon, KHÔNG phải do Nominatim trả về"
      - name: geocode_match_type
        tests: [not_null]
      - name: geocode_verified
        description: "Chỉ người soát mới được đặt true"
        tests: [not_null]
      - name: confidence
        description: "Độ tin cậy của anchor sau review; không tự mở cổng train"
        tests:
          - accepted_values:
              values: ['high', 'medium', 'low']
      - name: needs_manual_validation
        tests: [not_null]

  - name: hanoi_flood_points_seed
    description: >
      Danh mục điểm úng ngập Hà Nội được trích xuất và đối chiếu từ Quyết định
      2280/QĐ-UBND và Kế hoạch 138/KH-UBND. Toạ độ thực tế đã kiểm chứng qua geocoding.
      Tuyệt đối không tự suy diễn dòng dữ liệu để đảm bảo anti-hallucination.
    columns:
      - name: point_id
        description: "Mã định danh duy nhất của điểm úng ngập (ví dụ HN_FLD_001)"
        tests: [unique, not_null]
      - name: point_name
        description: "Tên chi tiết mô tả vị trí điểm úng ngập"
        tests: [not_null]
      - name: ward_name
        description: "Tên phường/xã hành chính chứa điểm úng ngập"
        tests: [not_null]
      - name: rain_scenario
        description: "Kịch bản mưa gây ngập theo phân loại QĐ 2280"
        tests:
          - not_null
          - accepted_values:
              values: ['scenario_50_70mm', 'scenario_70_100mm', 'scenario_over_100mm']
      - name: latitude
        description: "Vĩ độ WGS84 của điểm úng ngập"
        tests: [not_null]
      - name: longitude
        description: "Kinh độ WGS84 của điểm úng ngập"
        tests: [not_null]
      - name: status
        description: "Trạng thái điểm úng ngập (active / inactive)"
        tests:
          - not_null
          - accepted_values:
              values: ['active', 'inactive']
