transform:
  target: dev
  outputs:
    dev:
      type: duckdb
      path: ':memory:'
      settings:
        preserve_insertion_order: false
        threads: 4
        memory_limit: '6GB'
      extensions:
        - httpfs      # đọc file trên MinIO (S3)
        - ducklake    # lakehouse catalog
        - postgres    # đọc thẳng Postgres nguồn, không cần bước ingest trung gian

      secrets:
        - type: s3
          name: minio_secret
          key_id: "{{ env_var('MINIO_ACCESS_KEY', 'minioadmin') }}"
          secret: "{{ env_var('MINIO_SECRET_KEY', 'minioadmin') }}"
          endpoint: "{{ env_var('MINIO_ENDPOINT', '127.0.0.1:9000') }}"
          use_ssl: "{{ env_var('MINIO_SECURE', 'false') | as_native }}"
          url_style: path

      attach:
        # 1) Silver/Gold: metadata trong Postgres, dữ liệu trên MinIO root
        - path: "ducklake:postgres:dbname={{ env_var('POSTGRES_DB', 'vnclimate') }} host={{ env_var('POSTGRES_HOST', '127.0.0.1') }} port={{ env_var('POSTGRES_PORT', '5432') }} user={{ env_var('POSTGRES_USER', 'vnclimate') }} password={{ env_var('POSTGRES_PASSWORD', 'vnclimate') }}"
          alias: catalog1
          options:
            data_path: "s3://{{ env_var('MINIO_BUCKET', 'vn-climate') }}"
            metadata_schema: "ducklake"

        # 2) Bronze tables: root riêng để path luôn là bronze/tables/<table>/
        - path: "ducklake:postgres:dbname={{ env_var('POSTGRES_DB', 'vnclimate') }} host={{ env_var('POSTGRES_HOST', '127.0.0.1') }} port={{ env_var('POSTGRES_PORT', '5432') }} user={{ env_var('POSTGRES_USER', 'vnclimate') }} password={{ env_var('POSTGRES_PASSWORD', 'vnclimate') }}"
          alias: bronze_store
          options:
            data_path: "s3://{{ env_var('MINIO_BUCKET', 'vn-climate') }}/bronze"
            metadata_schema: "ducklake_bronze"

        # 3) Postgres NGUỒN (chỉ đọc) — dbt đọc trực tiếp dữ liệu địa lý
        - path: "dbname={{ env_var('POSTGRES_DB', 'vnclimate') }} host={{ env_var('POSTGRES_HOST', '127.0.0.1') }} port={{ env_var('POSTGRES_PORT', '5432') }} user={{ env_var('POSTGRES_USER', 'vnclimate') }} password={{ env_var('POSTGRES_PASSWORD', 'vnclimate') }}"
          alias: pg_source
          type: postgres
          options:
            read_only: true
