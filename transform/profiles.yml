transform:
  target: dev
  outputs:
    dev:
      type: duckdb
      path: ':memory:'
      settings:
        preserve_insertion_order: false
        threads: 4
        memory_limit: '6GB'
      extensions:
        - httpfs      # đọc file trên MinIO (S3)
        - ducklake    # lakehouse catalog
        - postgres    # metadata catalog của DuckLake nằm trong Postgres

      secrets:
        - type: s3
          name: minio_secret
          key_id: "{{ env_var('MINIO_ACCESS_KEY') }}"
          secret: "{{ env_var('MINIO_SECRET_KEY') }}"
          endpoint: "{{ env_var('MINIO_ENDPOINT', '127.0.0.1:9000') }}"
          use_ssl: "{{ env_var('MINIO_SECURE', 'false') | as_native }}"
          url_style: path

      attach:
        # MỘT catalog cho mọi bảng. DuckLake suy path là
        # <data_path>/<schema>/<table>, nên silver.stg_* nằm ở silver/stg_*/.
        - path: "ducklake:postgres:dbname={{ env_var('POSTGRES_DB', 'vnclimate') }} host={{ env_var('POSTGRES_HOST', '127.0.0.1') }} port={{ env_var('POSTGRES_PORT', '5432') }} user={{ env_var('POSTGRES_USER', 'vnclimate') }} password={{ env_var('POSTGRES_PASSWORD') }}"
          alias: catalog1
          options:
            data_path: "s3://{{ env_var('MINIO_BUCKET', 'vn-climate') }}"
            metadata_schema: "ducklake"


        # KHÔNG còn attach `pg_source`. Danh mục phường/xã chỉ đến từ seed
        # `ward_coordinates_seed.csv`. Bản cũ đọc song song cả Postgres nguồn
        # lẫn seed cho CÙNG một thực thể — hai đường, và khi chúng lệch nhau thì
        # không có quy tắc nào nói bên nào đúng.
