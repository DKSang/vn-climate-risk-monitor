version: 2

models:
  - name: dim_grid
    description: "Ô lưới thời tiết — nơi DUY NHẤT giữ lat/lon của ô"
    columns:
      - name: grid_cell_id
        tests: [unique, not_null]
      - name: weather_model
        tests:
          - not_null
          - accepted_values:
              arguments:
                values: ['era5', 'ecmwf_ifs', 'ecmwf_ifs_fc']
      - name: grid_latitude
        tests: [not_null]
      - name: grid_longitude
        tests: [not_null]

  - name: dim_ward
    description: >
      126 phường/xã Hà Nội. KHÔNG mang grid_cell_id — xem bridge.
      Materialized as a table from the versioned reference seed. `is_active`
      remains TRUE for dashboard compatibility; reference changes are published
      by rebuilding the table, not by runtime soft delete.
    columns:
      - name: ward_code
        tests: [unique, not_null]
      - name: ward_name
        tests: [not_null]
      - name: is_active
        description: "FALSE = không còn trong seed (giải thể/sáp nhập)"
        tests: [not_null]
      - name: _deactivated_at
        description: "Giữ contract lịch sử; static reference hiện không soft-delete"
      - name: _updated_at
        tests: [not_null]

  - name: bridge_ward_grid
    description: >
      Static phường ↔ ô lưới theo model, gồm cả mesh forecast hiện hành.
      Rebuilt from reference seeds and current forecast mesh; no runtime
      soft-delete state is maintained.
    columns:
      - name: ward_grid_key
        tests: [unique, not_null]
      - name: is_active
        tests: [not_null]
      - name: _deactivated_at
        description: "Giữ contract lịch sử; static reference hiện không soft-delete"
      - name: _updated_at
        tests: [not_null]
      - name: ward_code
        tests:
          - not_null
          - relationships:
              arguments:
                to: ref('dim_ward')
                field: ward_code
      - name: grid_cell_id
        tests:
          - not_null
          - relationships:
              arguments:
                to: ref('dim_grid')
                field: grid_cell_id
      - name: ward_count_on_grid
        description: "Số phường dùng chung ô này — để xếp hạng không nhân trọng số"
        tests: [not_null]

  - name: fct_flood_event_observation
    description: >
      Quan sát ngập đã xác nhận (địa điểm × thời điểm × nguồn), dùng để đối
      chiếu trực quan trên archive replay. Không phải feature huấn luyện hoặc
      đầu vào của pressure signal.
    columns:
      - name: observation_id
        tests: [unique, not_null]
      - name: event_id
        tests: [not_null]
      - name: location_key
        tests: [not_null]
      - name: ward_code
        description: >
          NULL cho tới khi geocode được NGƯỜI SOÁT. Không có not_null ở đây là
          CÓ CHỦ ĐÍCH — ép not_null sẽ buộc phải đoán phường, mà phường sai ghép
          nhãn với lượng mưa của chỗ khác.
        tests:
          - relationships:
              arguments:
                to: ref('dim_ward')
                field: ward_code
      - name: geocode_verified
        description: "Cổng duy nhất vào archive replay; chỉ người soát đặt true"
        tests: [not_null]
      - name: geocode_match_type
        description: "Kiểu anchor sau geocode/review; không đồng nghĩa với độ tin cậy"
        tests: [not_null]
      - name: geocode_confidence
        tests:
          - accepted_values:
              arguments:
                values: ['high', 'medium', 'low']
      - name: needs_manual_validation
        tests: [not_null]
      - name: observed_at_utc
        description: "NULL khi nguồn không ghi giờ; không suy đoán"
      - name: is_flooded
        tests: [not_null]
      - name: is_replay_eligible
        description: >
          Có thể hiện trên replay khi đủ cả ba: hạng A/B/C, biết rõ GIỜ, và có ward_code.
        tests: [not_null]
      - name: source_grade
        tests:
          - not_null
          - accepted_values:
              arguments:
                values: ['A', 'B', 'C', 'D']
      - name: traffic_status
        tests:
          - accepted_values:
              arguments:
                values: ['receded', 'passable', 'slow', 'diverted', 'impassable', 'unknown']

  - name: fct_rain_archive_hourly
    description: >
      Mưa theo ô lưới × giờ (Archive) + cửa sổ trượt 1/3/6/12/24h + dải
      kịch bản. `rain_{N}h_mm` NULL = cửa sổ thiếu giờ.
    columns:
      - name: rain_archive_hourly_key
        tests: [unique, not_null]
      - name: grid_cell_id
        tests:
          - not_null
          - relationships:
              arguments:
                to: ref('dim_grid')
                field: grid_cell_id
      - name: valid_time_utc
        tests: [not_null]
      - name: rain_date
        tests: [not_null]
      - name: _updated_at
        description: "Kế thừa từ silver.int_weather_archive_hourly — watermark của fact này"
        tests: [not_null]
      - name: hanoi_rain_scenario_band
        tests:
          - accepted_values:
              arguments:
                values: ['below_50', 'from_50_to_under_70', 'from_70_to_100', 'over_100']
      - name: hanoi_rain_scenario_level
        description: "NULL when the 1-hour rainfall window is incomplete"
      - name: vn_rain_band_12h
        tests:
          - accepted_values:
              arguments:
                values: ['below_30', 'from_30_to_under_50', 'from_50_to_under_70', 'from_70_to_100', 'over_100']
      - name: vn_rain_band_24h
        tests:
          - accepted_values:
              arguments:
                values: ['below_50', 'from_50_to_under_100', 'from_100_to_under_150', 'from_150_to_under_200', 'from_200_to_300', 'over_300']

  - name: fct_rain_forecast_hourly
    description: >
      Lịch sử mưa forecast theo run × ô lưới × giờ, có rolling trailing
      1/3/6/12/24h và các cột forecast_next_*h_mm nhìn về tương lai.
      Rolling partition theo run, không trộn vintage.
    columns:
      - name: rain_forecast_hourly_key
        tests: [unique, not_null]
      - name: forecast_run_id
        tests: [not_null]
      - name: grid_cell_id
        tests:
          - not_null
          - relationships:
              arguments:
                to: ref('dim_grid')
                field: grid_cell_id
      - name: valid_time_utc
        tests: [not_null]
      - name: forecast_date
        tests: [not_null]
      - name: _updated_at
        tests: [not_null]
      - name: forecast_next_24h_mm
        description: "Tổng forecast từ valid_time, gồm 24 giờ liên tiếp; NULL nếu thiếu horizon"
      - name: forecast_next_1h_mm
        description: "Tổng forecast từ valid_time, gồm 1 giờ"
      - name: forecast_next_3h_mm
        description: "Tổng forecast từ valid_time, gồm 3 giờ liên tiếp"
      - name: forecast_next_6h_mm
        description: "Tổng forecast từ valid_time, gồm 6 giờ liên tiếp"
      - name: forecast_next_12h_mm
        description: "Tổng forecast từ valid_time, gồm 12 giờ liên tiếp"
      - name: hanoi_rain_scenario_band
        tests:
          - accepted_values:
              arguments:
                values: ['below_50', 'from_50_to_under_70', 'from_70_to_100', 'over_100']
      - name: hanoi_rain_scenario_level
        description: "NULL when the 1-hour rainfall window is incomplete"
      - name: forecast_next_1h_band
        tests:
          - accepted_values:
              arguments:
                values: ['below_50', 'from_50_to_under_70', 'from_70_to_100', 'over_100']
      - name: forecast_next_12h_band
        tests:
          - accepted_values:
              arguments:
                values: ['below_30', 'from_30_to_under_50', 'from_50_to_under_70', 'from_70_to_100', 'over_100']
      - name: forecast_next_24h_band
        tests:
          - accepted_values:
              arguments:
                values: ['below_50', 'from_50_to_under_100', 'from_100_to_under_150', 'from_150_to_under_200', 'from_200_to_300', 'over_300']
      - name: vn_rain_band_12h
        tests:
          - accepted_values:
              arguments:
                values: ['below_30', 'from_30_to_under_50', 'from_50_to_under_70', 'from_70_to_100', 'over_100']
      - name: vn_rain_band_24h
        tests:
          - accepted_values:
              arguments:
                values: ['below_50', 'from_50_to_under_100', 'from_100_to_under_150', 'from_150_to_under_200', 'from_200_to_300', 'over_300']

  - name: fct_rain_forecast_current_hourly
    description: "View chỉ current horizon của logical forecast run mới nhất"
    columns:
      - name: rain_forecast_hourly_key
        tests: [unique, not_null]
      - name: forecast_run_id
        tests: [not_null]
      - name: valid_time_utc
        tests: [not_null]

  - name: fct_rain_pressure_alert
    description: >
      Tín hiệu cảnh báo áp lực mưa theo phường × giờ. Kết hợp forecast nhìn về
      tương lai với độ bền và thay đổi giữa các forecast run; không phải xác
      suất ngập hay cảnh báo thiên tai chính thức.
    columns:
      - name: rain_pressure_alert_key
        tests: [unique, not_null]
      - name: forecast_run_id
        tests: [not_null]
      - name: ward_code
        tests:
          - not_null
          - relationships:
              arguments:
                to: ref('dim_ward')
                field: ward_code
      - name: grid_cell_id
        tests:
          - not_null
          - relationships:
              arguments:
                to: ref('dim_grid')
                field: grid_cell_id
      - name: valid_time_utc
        tests: [not_null]
      - name: pressure_level
        tests:
          - not_null
          - accepted_values:
              arguments:
                values: ['UNKNOWN', 'NORMAL', 'WATCH', 'ELEVATED', 'HIGH']
      - name: pressure_score
        description: >
          Điểm 0–100 từ các cửa sổ hiện có; NULL khi không còn cửa sổ nào đủ giờ.
          Không dùng NULL như giá trị 0.
      - name: coverage_status
        description: "Độ đầy đủ của bốn input 1/3/6/24h dùng bởi pressure signal"
        tests:
          - not_null
          - accepted_values:
              arguments:
                values: ['COMPLETE', 'PARTIAL', 'NONE']
      - name: revision_direction
        tests:
          - not_null
          - accepted_values:
              arguments:
                values: ['UNKNOWN', 'NEW', 'RISING', 'FALLING', 'STABLE']
      - name: persistence_runs
        tests: [not_null]
