version: 2

models:
  - name: dim_ward
    description: "Hanoi's 126 wards and communes, from the versioned seed."
    columns:
      - name: ward_code
        tests: [unique, not_null]

  - name: dim_grid
    description: "Weather-model grid cells the wards fall in (scripts/map_ward_grid.py)."
    columns:
      - name: grid_cell_id
        tests: [unique, not_null]

  - name: bridge_ward_grid
    description: "One grid cell per ward and weather model."
    tests:
      - unique_combination:
          arguments:
            columns: [ward_code, weather_model]
    columns:
      - name: ward_code
        tests:
          - relationships:
              arguments:
                to: ref('dim_ward')
                field: ward_code
      - name: grid_cell_id
        tests:
          - relationships:
              arguments:
                to: ref('dim_grid')
                field: grid_cell_id

  - name: fct_rain_forecast_hourly
    description: >
      Every forecast run x grid cell x hour with rolling (past) and forward
      rainfall windows computed inside the run. Windows are NULL when they
      reach past the run's hours.
    tests:
      - rain_windows_monotonic
      - unique_combination:
          arguments:
            columns: [forecast_run, grid_cell_id, valid_at]
    columns:
      - name: forecast_run
        tests: [not_null]
      - name: valid_at
        tests: [not_null]
      - name: grid_cell_id
        tests:
          - not_null
          - relationships:
              arguments:
                to: ref('dim_grid')
                field: grid_cell_id

  - name: fct_rain_archive_hourly
    description: >
      Past rainfall per grid cell x hour with rolling windows over the whole
      history (NULL until a window has all its hours).
    tests:
      - rain_windows_monotonic
      - unique_combination:
          arguments:
            columns: [grid_cell_id, valid_at]
    columns:
      - name: grid_cell_id
        tests:
          - not_null
          - relationships:
              arguments:
                to: ref('dim_grid')
                field: grid_cell_id

  - name: fct_rain_forecast_current_hourly
    description: "The latest forecast run, from the current hour on."
    tests:
      - unique_combination:
          arguments:
            columns: [forecast_run, grid_cell_id, valid_at]

  - name: fct_rain_pressure_alert
    description: >
      Explainable rain-pressure score per ward and hour of the current forecast
      run; a prioritisation signal, not a flood probability.
    tests:
      - unique_combination:
          arguments:
            columns: [forecast_run, ward_code, valid_at]
    columns:
      - name: ward_code
        tests: [not_null]
      - name: pressure_level
        tests:
          - accepted_values:
              arguments:
                values: ['NORMAL', 'WATCH', 'ELEVATED', 'HIGH', 'UNKNOWN']

unit_tests:
  - name: rain_windows_sum_whole_hours_and_are_null_when_incomplete
    description: >
      Rolling windows look back, forward windows look ahead, both within one
      forecast run and grid cell; a window missing any hour is NULL.
    model: fct_rain_forecast_hourly
    overrides:
      macros:
        is_incremental: false
    given:
      - input: ref('clean_weather_forecast_hourly')
        rows:
          - {forecast_run: "2026-09-24 00:00:00+00", grid_cell_id: cell, valid_at: "2026-09-24 00:00:00+00", precipitation_mm: 1}
          - {forecast_run: "2026-09-24 00:00:00+00", grid_cell_id: cell, valid_at: "2026-09-24 01:00:00+00", precipitation_mm: 2}
          - {forecast_run: "2026-09-24 00:00:00+00", grid_cell_id: cell, valid_at: "2026-09-24 02:00:00+00", precipitation_mm: 3}
          - {forecast_run: "2026-09-24 00:00:00+00", grid_cell_id: cell, valid_at: "2026-09-24 03:00:00+00", precipitation_mm: 4}
    expect:
      rows:
        - {valid_at: "2026-09-24 00:00:00+00", rain_1h_mm: 1, rain_3h_mm: null, forecast_next_3h_mm: 6}
        - {valid_at: "2026-09-24 01:00:00+00", rain_1h_mm: 2, rain_3h_mm: null, forecast_next_3h_mm: 9}
        - {valid_at: "2026-09-24 02:00:00+00", rain_1h_mm: 3, rain_3h_mm: 6, forecast_next_3h_mm: null}
        - {valid_at: "2026-09-24 03:00:00+00", rain_1h_mm: 4, rain_3h_mm: 9, forecast_next_3h_mm: null}
