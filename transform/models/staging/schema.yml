version: 2

models:
  - name: stg_open_meteo__weather_archive_hourly
    description: >
      View mỏng trên staging vật lý `silver.stg_weather_archive_hourly` (do autoloader
      ghi ngoài đồ thị dbt). Chỉ chọn cột và loại dòng không có grain; KHÔNG
      dedup — đó là việc của `int_weather_archive_hourly`.
    columns:
      - name: weather_model
        tests:
          - not_null
          - accepted_values:
              values: ['era5', 'ecmwf_ifs']
      - name: valid_time_utc
        tests: [not_null]
      - name: grid_latitude
        tests: [not_null]
      - name: grid_longitude
        tests: [not_null]
      - name: _source_file
        tests: [not_null]
      - name: _ingested_at
        tests: [not_null]

  - name: stg_open_meteo__weather_forecast_hourly
    description: >
      View mỏng trên staging vật lý `silver.stg_weather_forecast` (do autoloader
      ghi). Gán weather_model cố định 'ecmwf_ifs_fc' và loại dòng thiếu valid_time_utc.
    columns:
      - name: weather_model
        tests:
          - not_null
          - accepted_values:
              values: ['ecmwf_ifs_fc']
      - name: valid_time_utc
        tests: [not_null]
      - name: grid_latitude
        tests: [not_null]
      - name: grid_longitude
        tests: [not_null]
      - name: _source_file
        tests: [not_null]
      - name: _ingested_at
        tests: [not_null]

  - name: stg_seed__ward
    description: "126 phường/xã Hà Nội, lọc từ seed 3.321 đơn vị toàn quốc"
    columns:
      - name: ward_code
        tests: [unique, not_null]
      - name: ward_name
        tests: [not_null]
      - name: ward_latitude
        tests: [not_null]
      - name: ward_longitude
        tests: [not_null]

  - name: stg_seed__ward_grid
    description: >
      Phường × model → ô lưới, lấy từ phép snap của Open-Meteo chứ không phải
      nearest-neighbour tự tính.
    columns:
      - name: ward_code
        tests:
          - not_null
          - relationships:
              to: ref('stg_seed__ward')
              field: ward_code
      - name: weather_model
        tests:
          - not_null
          - accepted_values:
              values: ['era5', 'ecmwf_ifs']
      - name: grid_cell_id
        tests: [not_null]

  - name: stg_seed__flood_point
    description: >
      View mỏng cho điểm úng ngập từ seed. Canonicalize toạ độ 6 số và ánh xạ
      lấy ward_code từ stg_seed__ward.
    columns:
      - name: point_id
        tests: [unique, not_null]
      - name: point_name
        tests: [not_null]
      - name: ward_name
        tests: [not_null]
      - name: ward_code
        description: "Mã phường 5 ký tự sau sắp xếp 2025"
        tests: [not_null]
      - name: rain_scenario
        tests:
          - not_null
          - accepted_values:
              values: ['scenario_50_70mm', 'scenario_70_100mm', 'scenario_over_100mm']
      - name: latitude
        tests: [not_null]
      - name: longitude
        tests: [not_null]
      - name: status
        tests:
          - not_null
          - accepted_values:
              values: ['active', 'inactive']

  - name: stg_seed__flood_observation
    description: >
      View mỏng cho quan sát ngập từ seed Flourish/VnExpress. Giữ nguyên các cột
      `*_raw` để mọi phép suy diễn từ câu chữ tiếng Việt còn đối chiếu được.
      `ward_code` hiện luôn NULL — nguồn ghi địa điểm theo cột mốc đường, chưa
      geocode được sang phường.
    columns:
      - name: observation_id
        tests: [unique, not_null]
      - name: event_id
        tests: [not_null]
      - name: is_flooded
        tests: [not_null]
      - name: observed_at_precision
        tests:
          - not_null
          - accepted_values:
              values: ['hour', 'unknown']
      - name: source_grade
        tests:
          - not_null
          - accepted_values:
              values: ['A', 'B', 'C', 'D']
