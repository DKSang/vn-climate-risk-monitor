version: 2

models:
  - name: stg_seed__ward
    description: "126 phường/xã Hà Nội, lọc từ seed 3.321 đơn vị toàn quốc"
    columns:
      - name: ward_code
        tests: [unique, not_null]
      - name: ward_name
        tests: [not_null]
      - name: ward_latitude
        tests: [not_null]
      - name: ward_longitude
        tests: [not_null]

  - name: stg_seed__ward_grid
    description: >
      Phường × model → ô lưới, lấy từ phép snap của Open-Meteo chứ không phải
      nearest-neighbour tự tính.
    columns:
      - name: ward_code
        tests:
          - not_null
          - relationships:
              arguments:
                to: ref('stg_seed__ward')
                field: ward_code
      - name: weather_model
        tests:
          - not_null
          - accepted_values:
              arguments:
                values: ['era5', 'ecmwf_ifs']
      - name: grid_cell_id
        tests: [not_null]
