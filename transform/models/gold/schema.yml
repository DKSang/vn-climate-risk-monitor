version: 2

models:
  - name: dim_hanoi_ward
    description: >
      GOLD — Dimension: 126 phường/xã Hà Nội sau sắp xếp 2025
      (NQ 1656/NQ-UBTVQH15, hiệu lực 01/07/2025). Khoá chiều cho các fact
      rủi ro khí hậu sẽ xây ở bước sau.
    columns:
      - name: ward_key
        description: "Khoá thay thế của chiều — fact join vào cột này"
        tests: [unique, not_null]
      - name: ward_code
        description: "Mã hành chính phường/xã 5 ký tự"
        tests: [unique, not_null]
      - name: ward_name
        description: "Tên phường/xã tiếng Việt"
        tests: [not_null]
      - name: province_code
        description: "Luôn là '01' — phạm vi gold giới hạn ở Hà Nội"
        tests:
          - not_null
          - accepted_values:
              arguments:
                values: ['01']
      - name: latitude
        tests: [not_null]
      - name: longitude
        tests: [not_null]

  - name: fct_rainfall_forecast_hourly
    description: >
      GOLD — rolling rainfall 1/3/6/12/24/48/72 giờ theo returned model grid,
      chỉ công bố giá trị khi đủ coverage.
    columns:
      - name: forecast_snapshot_id
        tests: [not_null]
      - name: grid_cell_id
        tests: [not_null]
      - name: valid_time_utc
        tests: [not_null]

  - name: fct_rainfall_forecast_summary
    description: >
      GOLD — tổng mưa và peak trong horizon 3/6/12/24/48 giờ cho mỗi grid.
    columns:
      - name: forecast_snapshot_id
        tests: [not_null]
      - name: grid_cell_id
        tests: [not_null]
      - name: as_of_utc
        tests: [not_null]

  - name: fct_ward_rainfall_forecast_hourly
    description: "Projection rolling rainfall từ grid sang 126 phường Hà Nội."
    columns:
      - name: ward_key
        tests: [not_null]
      - name: ward_code
        tests: [not_null]
      - name: grid_cell_id
        tests: [not_null]
      - name: valid_time_utc
        tests: [not_null]

  - name: fct_ward_rainfall_forecast_summary
    description: "Projection forecast horizon summary sang 126 phường Hà Nội."
    columns:
      - name: ward_key
        tests: [unique, not_null]
      - name: ward_code
        tests: [unique, not_null]
      - name: grid_cell_id
        tests: [not_null]
