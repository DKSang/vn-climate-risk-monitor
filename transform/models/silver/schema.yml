version: 2

models:
  - name: wards
    description: >
      SILVER — danh mục phường/xã GSO đã làm sạch. Grain nguồn: 3.321 phường/xã
      toàn quốc, chưa lọc tỉnh.
    columns:
      - name: ward_code
        description: "Mã phường/xã 5 ký tự — khoá join"
        tests: [unique, not_null]
      - name: ward_name
        tests: [not_null]
      - name: province_code
        description: "Mã tỉnh 2 ký tự đã zero-pad ('01' = Hà Nội)"
        tests: [not_null]

  - name: ward_centroids
    description: >
      SILVER — toạ độ centroid phường/xã đã làm sạch và ép kiểu.
      Grain nguồn: 3.321 phường/xã toàn quốc.
    columns:
      - name: location_key
        tests: [unique, not_null]
      - name: ward_code
        description: "Mã phường/xã 5 ký tự đã zero-pad từ BIGINT"
        tests: [unique, not_null]
      - name: province_code
        tests: [not_null]
      - name: latitude
        tests: [not_null]
      - name: longitude
        tests: [not_null]

  - name: ward_locations
    description: >
      SILVER — ward master toàn quốc: toạ độ JOIN danh mục GSO. Đã validate,
      CHƯA aggregate (đúng yêu cầu của Microsoft cho lớp silver).
    columns:
      - name: location_key
        tests: [unique, not_null]
      - name: ward_code
        tests: [unique, not_null]
      - name: province_code
        tests: [not_null]
      - name: latitude
        tests: [not_null]
      - name: longitude
        tests: [not_null]
      - name: has_gso_match
        description: "FALSE ở 2 dòng lệch mã giữa 2 nguồn (Ba Chẽ, Ia Mơ)"
        tests: [not_null]

  # ── THỬ NGHIỆM: contract enforced (thứ Soda KHÔNG có) ─────────────────────
  # dbt kiểm tra tên cột + KIỂU dữ liệu TRƯỚC khi ghi. Sai kiểu -> build fail,
  # bảng không bị ghi đè bằng dữ liệu sai schema.
  - name: forecast_hourly
    description: >
      SILVER — snapshot forecast hoàn chỉnh mới nhất, grain
      (forecast_snapshot_id, grid_cell_id, valid_time_utc). Không ghép các
      retrieval slot khác nhau.
    config:
      contract:
        enforced: true
    columns:
      - name: forecast_snapshot_id
        data_type: VARCHAR
        constraints: [{type: not_null}]
      - name: as_of_utc
        data_type: TIMESTAMP WITH TIME ZONE
        constraints: [{type: not_null}]
      - name: weather_model
        data_type: VARCHAR
        constraints: [{type: not_null}]
      - name: weather_product
        data_type: VARCHAR
        constraints: [{type: not_null}]
      - name: grid_cell_id
        data_type: VARCHAR
        constraints: [{type: not_null}]
      - name: grid_latitude
        data_type: DOUBLE
        constraints: [{type: not_null}]
      - name: grid_longitude
        data_type: DOUBLE
        constraints: [{type: not_null}]
      - name: valid_time_utc
        data_type: TIMESTAMP WITH TIME ZONE
        constraints: [{type: not_null}]
      - name: precipitation_mm
        data_type: DOUBLE
      - name: rain_mm
        data_type: DOUBLE
      - name: showers_mm
        data_type: DOUBLE
      - name: precipitation_probability_pct
        data_type: INTEGER
      - name: weather_code
        data_type: INTEGER
      - name: source_object_keys
        data_type: VARCHAR
        constraints: [{type: not_null}]
      - name: _ingested_at
        data_type: TIMESTAMP WITH TIME ZONE

  - name: archive_hourly
    description: >
      SILVER — lịch sử theo giờ, gộp ERA5 (trước 2017) và ECMWF IFS (từ 2017).
      Grain (weather_model, ô lưới, giờ). Hai model không phải một chuỗi:
      không so trung bình trước/sau mốc 2017.
    columns:
      - name: weather_model
        description: "era5 hoặc ecmwf_ifs — bắt buộc trong mọi join phía sau"
        tests: [not_null]
      - name: weather_product
        tests:
          - not_null
          - accepted_values:
              arguments:
                values: ['archive']
      - name: grid_cell_id
        tests: [not_null]
      - name: grid_latitude
        tests: [not_null]
      - name: grid_longitude
        tests: [not_null]
      - name: valid_time_utc
        tests: [not_null]

  - name: ward_grid_map
    description: >
      SILVER — 126 phường Hà Nội → ô lưới từng model archive, lấy từ phép snap
      của Open-Meteo (seed), không phải nearest-neighbour tự tính.
    columns:
      - name: weather_model
        tests: [not_null]
      - name: weather_product
        tests:
          - not_null
          - accepted_values:
              arguments:
                values: ['archive']
      - name: ward_code
        tests: [not_null]
      - name: ward_key
        tests: [not_null]
      - name: grid_latitude
        tests: [not_null]
      - name: grid_longitude
        tests: [not_null]

  - name: bridge_hanoi_ward_forecast_grid
    description: >
      Map 126 centroid Hà Nội sang returned grid gần nhất trong snapshot
      forecast hiện hành.
    columns:
      - name: ward_key
        tests: [unique, not_null]
      - name: ward_code
        tests: [unique, not_null]
      - name: forecast_snapshot_id
        tests: [not_null]
      - name: grid_cell_id
        tests: [not_null]
      - name: mapping_distance_km
        tests: [not_null]
