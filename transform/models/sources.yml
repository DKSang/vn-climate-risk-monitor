version: 2

sources:
  # ── Nguồn 1: Postgres (danh mục hành chính GSO) ─────────────────────────────
  # DuckDB ATTACH thẳng Postgres (read_only) trong profiles.yml -> dbt đọc trực
  # tiếp. Không cần dlt land parquet trung gian cho dữ liệu tĩnh dạng bảng này.
  - name: pg_source
    database: pg_source
    schema: public
    description: "Postgres nguồn — danh mục đơn vị hành chính Việt Nam (post-2025)"
    tables:
      - name: provinces
        description: "34 tỉnh/thành sau sáp nhập 2025"
      - name: wards
        description: "3.321 phường/xã toàn quốc"
      - name: administrative_units
        description: "Loại đơn vị hành chính"
      - name: administrative_regions
        description: "Vùng địa lý hành chính"

  # ── Nguồn 2: CSV thô trên MinIO ─────────────────────────────────────────────
  # Không phải bảng — dbt đọc trực tiếp bằng read_csv_auto().
  - name: raw_files
    description: "File thô đã land trên MinIO (s3://vn-climate/raw/...)"
    meta:
      external_location: "read_csv_auto('s3://vn-climate/raw/geography/crawl/coordinates_locations/full/2026/08/20/dim_location.csv')"
    tables:
      - name: dim_location
        description: "Toạ độ centroid 3.321 phường/xã (lat, lon, region, climate_zone)"
