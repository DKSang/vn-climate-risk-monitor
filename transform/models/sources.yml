version: 2

sources:
  # ── Bronze do autoloader ghi (KHÔNG phải dbt model) ────────────────────────
  # dbt chỉ có thể coi đây là source: test được, freshness được, nhưng KHÔNG
  # enforce contract được (contract: enforced chỉ áp dụng cho model).
  - name: bronze_weather
    database: bronze_store
    schema: tables
    description: "Bronze Open-Meteo do autoloader nạp từ JSON thô trên MinIO"

    # Freshness: thay thế trực tiếp cho check `freshness` của Soda
    loaded_at_field: _ingested_at
    freshness:
      warn_after: {count: 6, period: hour}
      error_after: {count: 24, period: hour}

    tables:
      - name: open_meteo_forecast
        description: "Dự báo theo giờ, grain (ô lưới model, giờ hợp lệ)"
        columns:
          - name: grid_latitude
            tests: [not_null]
          - name: grid_longitude
            tests: [not_null]
          - name: valid_time_utc
            tests: [not_null]
          - name: precipitation_mm
            description: "mm/h; NULL hợp lệ khi nguồn thiếu giá trị"
          - name: weather_code
            description: "WMO weather code"

      - name: open_meteo_archive
        description: "Lịch sử ERA5 theo giờ (trước 2017), grain (ô lưới, giờ hợp lệ)"
        # Archive là dữ liệu lịch sử, không cần freshness theo giờ
        freshness: null
        columns:
          - name: grid_latitude
            tests: [not_null]
          - name: grid_longitude
            tests: [not_null]
          - name: valid_time_utc
            tests: [not_null]
          - name: soil_moisture_0_to_7cm
            description: "m³/m³"

      - name: open_meteo_ifs
        description: >
          Lịch sử ECMWF IFS theo giờ (từ 2017, ~9km), grain (ô lưới, giờ hợp lệ).
          Bảng do autoloader tạo ở lần nạp IFS đầu tiên; không gắn test nguồn ở
          đây vì `dbt build` phải chạy được trước lần fetch IFS nào.
        freshness: null

  # ── Nguồn 1: Postgres (danh mục hành chính GSO) ─────────────────────────────
  # DuckDB ATTACH thẳng Postgres (read_only) trong profiles.yml -> dbt đọc trực
  # tiếp. Không cần dlt land parquet trung gian cho dữ liệu tĩnh dạng bảng này.
  - name: pg_source
    database: pg_source
    schema: public
    description: "Postgres nguồn — danh mục đơn vị hành chính Việt Nam (post-2025)"
    tables:
      - name: provinces
        description: "34 tỉnh/thành sau sáp nhập 2025"
      - name: wards
        description: "3.321 phường/xã toàn quốc"
      - name: administrative_units
        description: "Loại đơn vị hành chính"
      - name: administrative_regions
        description: "Vùng địa lý hành chính"

  # ── Nguồn 2 (ĐÃ BỎ): CSV trên MinIO ─────────────────────────────────────────
  # Toạ độ centroid phường/xã trước đây đọc từ MinIO bằng read_csv_auto().
  # Nay chuyển thành dbt seed: transform/seeds/ward_coordinates_seed.csv
  # Lý do và đánh đổi: xem docs/03-architecture.md ADR-6.
