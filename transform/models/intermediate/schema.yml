version: 2

models:
  - name: int_weather_archive_hourly
    description: >
      CURATED — một dòng hiện hành cho mỗi (ô lưới, giờ). Table incremental với
      MERGE change-aware: chỉ ghi dòng có `_row_hash` khác, nên lần chạy không
      có dữ liệu mới ghi đúng 0 dòng và `_updated_at` của phần còn lại đứng yên.
    columns:
      - name: weather_archive_hourly_key
        description: "MD5(grid_cell_id | valid_time_utc) — merge key"
        tests: [unique, not_null]
      - name: _row_hash
        description: >
          MD5 các cột GIÁ TRỊ. Không gồm `_source_file`/`_ingested_at`: cùng giá
          trị đến từ file khác không phải là dữ liệu đổi.
        tests: [not_null]
      - name: _updated_at
        description: "Chỉ nhích khi `_row_hash` đổi. Watermark của Gold trên cột này."
        tests: [not_null]
      - name: is_active
        tests: [not_null]
      - name: grid_cell_id
        description: "Sinh MỘT LẦN ở đây; mọi lớp sau chỉ dùng id"
        tests: [not_null]
      - name: weather_model
        tests:
          - not_null
          - accepted_values:
              arguments:
                values: ['era5', 'ecmwf_ifs']
      - name: valid_time_utc
        tests: [not_null]

  - name: int_weather_forecast_hourly
    description: >
      CURATED HISTORY — một dòng cho mỗi logical forecast run × ô lưới
      × valid_time. Chỉ publish run đủ 126 locations × 72 giờ.
    columns:
      - name: weather_forecast_hourly_key
        description: "MD5(forecast_run_id | grid_cell_id | valid_time_utc)"
        tests: [unique, not_null]
      - name: _row_hash
        tests: [not_null]
      - name: _updated_at
        description: "Thời điểm vintage được publish vào Silver."
        tests: [not_null]
      - name: forecast_run_id
        description: "Logical retrieval run từ path raw, ví dụ run_20260907T101500"
        tests: [not_null]
      - name: is_active
        tests: [not_null]
      - name: grid_cell_id
        tests: [not_null]
      - name: weather_model
        tests:
          - not_null
          - accepted_values:
              arguments:
                values: ['ecmwf_ifs_fc']
      - name: valid_time_utc
        tests: [not_null]
