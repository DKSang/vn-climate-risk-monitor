name: 'transform'
version: '1.0.0'

profile: 'transform'

model-paths: ["models"]
test-paths: ["tests"]
seed-paths: ["seeds"]
macro-paths: ["macros"]

clean-targets:         # directories to be removed by `dbt clean`
  - "target"
  - "dbt_packages"

vars:
  # The one weather model the pipeline fetches (pipeline/open_meteo/fetch.py).
  forecast_model: ecmwf_ifs
  # Start time of the last successful job run, passed by pipeline/job_run.py.
  watermark: null
  # Portfolio thresholds; not official hazard warnings.
  rain_pressure_thresholds:
    watch_next_6h_mm: 30
    watch_next_24h_mm: 50
    elevated_next_6h_mm: 50
    elevated_next_24h_mm: 100
    high_next_1h_mm: 70
    high_next_3h_mm: 50
    high_next_6h_mm: 100
    revision_up_mm: 10

# Seeds are versioned references; keep code-like IDs as VARCHAR.
seeds:
  transform:
    +database: catalog1
    +schema: seed
    ward_grid_map_seed:
      +column_types:
        model: VARCHAR
        ward_code: VARCHAR
        ward_latitude: DOUBLE
        ward_longitude: DOUBLE
        grid_latitude: DOUBLE
        grid_longitude: DOUBLE
        elevation_m: DOUBLE
    ward_coordinates_seed:
      +column_types:
        location_key: INTEGER
        province_code: VARCHAR
        province_name: VARCHAR
        commune_code: VARCHAR
        commune_name: VARCHAR
        latitude: DOUBLE
        longitude: DOUBLE
        region: VARCHAR
        climate_zone: VARCHAR

# Bronze is Python-owned; dbt starts from the silver.stg_ sources.
models:
  transform:
    # All dbt models share the DuckLake catalog.
    +database: catalog1

    # clean_ tables merge the Python-loaded stg_ tables incrementally from
    # the watermark var (docs/adr/0001-watermark-incremental-pattern.md).
    silver:
      +schema: silver
      +tags: ['silver']

    # Seed references, normalised as views in Silver.
    staging:
      +schema: silver
      +materialized: view
      +tags: ['staging']

    # Gold: tables, except the forecast history fact (incremental merge).
    marts:
      +schema: gold
      +materialized: table
      +tags: ['marts']
