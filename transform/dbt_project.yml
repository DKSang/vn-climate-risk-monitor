
# Name your project! Project names should contain only lowercase characters
# and underscores. A good package name should reflect your organization's
# name or the intended use of these models
name: 'transform'
version: '1.0.0'

# This setting configures which "profile" dbt uses for this project.
profile: 'transform'

# These configurations specify where dbt should look for different types of files.
# The `model-paths` config, for example, states that models in this project can be
# found in the "models/" directory. You probably won't need to change these!
model-paths: ["models"]
analysis-paths: ["analyses"]
test-paths: ["tests"]
seed-paths: ["seeds"]
macro-paths: ["macros"]
snapshot-paths: ["snapshots"]

clean-targets:         # directories to be removed by `dbt clean`
  - "target"
  - "dbt_packages"

vars:
  # Cùng biến mà fetcher dùng; completeness gate không được hard-code lệch với
  # số giờ thực sự yêu cầu từ Open-Meteo.
  forecast_expected_hours: "{{ env_var('OPEN_METEO_FORECAST_HOURS', '72') }}"
  forecast_expected_locations: 126
  # Rule-based rainfall pressure signal. Đây là ngưỡng vận hành của portfolio,
  # không phải ngưỡng cảnh báo thiên tai chính thức.
  rain_pressure_thresholds:
    watch_next_6h_mm: 30
    watch_next_24h_mm: 50
    elevated_next_6h_mm: 50
    elevated_next_24h_mm: 100
    high_next_1h_mm: 70
    high_next_3h_mm: 50
    high_next_6h_mm: 100
    revision_up_mm: 10


# Configuring models
# Full documentation: https://docs.getdbt.com/docs/configuring-models

# In this example config, we tell dbt to build all models in the example/
# directory as views. These settings can be overridden in the individual model
# files using the `{{ config(...) }}` macro.
# DuckLake maintenance KHÔNG nằm trong on-run-end: test/build hourly không được
# kiêm nhiệm expire snapshot hay xóa Parquet. DAG lakehouse_maintenance_daily
# giữ snapshot 7 ngày và chỉ cleanup file đã chờ đủ grace period.

# Seed: file CSV tĩnh, version-control cùng code.
#
# column_types là BẮT BUỘC ở đây, không phải tuỳ chọn: CSV gốc lưu mã hành chính
# đã zero-pad ('01', '00004'). Nếu để dbt tự suy kiểu, chúng thành BIGINT (1, 4)
# và MẤT số 0 đầu — đúng vấn đề mà read_csv_auto trên MinIO đã gây ra trước đây,
# khiến silver phải LPAD lại. Ép VARCHAR để bronze giữ đúng nguyên bản nguồn.
#
# Seed nằm ở schema `seed`, KHÔNG phải `bronze`: nó là input artifact được
# version-control cùng code, không phải một lớp của medallion.
seeds:
  transform:
    +database: catalog1
    +schema: seed
    # Artifact audit trung gian để người review; canonical seed ở dưới mới là
    # input của DAG. Không publish nhầm file này thành một bảng production.
    hanoi_flood_regeocoded_123_audit:
      +enabled: false
    ward_grid_map_seed:
      +column_types:
        model: VARCHAR
        ward_code: VARCHAR
        ward_latitude: DOUBLE
        ward_longitude: DOUBLE
        grid_latitude: DOUBLE
        grid_longitude: DOUBLE
        elevation_m: DOUBLE
    ward_coordinates_seed:
      +column_types:
        location_key: INTEGER
        province_code: VARCHAR
        province_name: VARCHAR
        commune_code: VARCHAR
        commune_name: VARCHAR
        latitude: DOUBLE
        longitude: DOUBLE
        region: VARCHAR
        climate_zone: VARCHAR
    hanoi_flood_points_seed:
      +column_types:
        point_id: VARCHAR
        point_name: VARCHAR
        street_name: VARCHAR
        ward_name: VARCHAR
        district_name: VARCHAR
        drainage_basin: VARCHAR
        rain_scenario: VARCHAR
        typical_depth_cm: VARCHAR
        latitude: DOUBLE
        longitude: DOUBLE
        status: VARCHAR
        source_reference: VARCHAR
    # Sinh bởi `make fetch-flood-observations`, không sửa tay: mọi dòng phải
    # truy được về đúng một snapshot Flourish có version.
    #
    # `observed_at_local` giữ VARCHAR chứ không để dbt suy TIMESTAMP: 4/123
    # dòng có giá trị RỖNG (nguồn không ghi giờ), và kiểu suy tự động sẽ biến
    # ô rỗng thành NULL lẫn với ô có giờ hợp lệ mà không phân biệt được.
    flood_event_observations_seed:
      +column_types:
        observation_id: VARCHAR
        event_id: VARCHAR
        location_name_raw: VARCHAR
        depth_text_raw: VARCHAR
        traffic_text_raw: VARCHAR
        depth_min_cm: DOUBLE
        depth_max_cm: DOUBLE
        traffic_status: VARCHAR
        observed_at_local: VARCHAR
        as_of_local: VARCHAR
        is_flooded: BOOLEAN
        source_grade: VARCHAR
        source_publisher: VARCHAR
        source_url: VARCHAR
        source_visualisation_id: VARCHAR
        source_visualisation_version: VARCHAR
        source_updated_at_utc: VARCHAR
    # File NGƯỜI sửa, tách khỏi file máy sinh ở trên. Nối bằng observation_id.
    # Tách vì `flood_event_observations_seed.csv` bị ghi đè mỗi lần fetch lại;
    # gộp chung thì công soát toạ độ biến mất ở lần fetch kế tiếp.
    flood_observation_geocode_seed:
      +column_types:
        observation_id: VARCHAR
        location_name_raw: VARCHAR
        query_sent: VARCHAR
        latitude: DOUBLE
        longitude: DOUBLE
        # Zero-pad ('00070'). Để dbt suy kiểu sẽ thành BIGINT và mất số 0 đầu.
        ward_code: VARCHAR
        ward_name: VARCHAR
        geocode_source: VARCHAR
        geocode_match_type: VARCHAR
        geocode_verified: BOOLEAN
        review_note: VARCHAR
        anchor_type: VARCHAR
        confidence: VARCHAR
        coordinate_basis: VARCHAR
        coordinate_changed_from_input: BOOLEAN
        ward_changed_from_input: BOOLEAN
        original_latitude: DOUBLE
        original_longitude: DOUBLE
        original_ward_code: VARCHAR
        original_ward_name: VARCHAR
        needs_manual_validation: BOOLEAN
        verified_at_utc: VARCHAR
        verification_method: VARCHAR

# KHÔNG có thư mục `bronze/` trong models: Bronze là việc của autoloader, dbt
# chỉ ĐỌC qua `source()`. Ranh giới đó giữ ingest và transform tách bạch —
# bản cũ có 5 model dbt ghi vào Bronze, tức hai cơ chế ingest song song.
models:
  transform:
    # Mọi model đều nằm trong DuckLake catalog (Postgres metadata + MinIO Parquet)
    +database: catalog1

    # Ba lớp chuẩn: staging -> intermediate -> marts. THƯ MỤC là cấu trúc dbt;
    # TÊN VẬT LÝ (schema DuckLake) vẫn theo medallion: staging + intermediate
    # vào `silver`, marts vào `gold`. SILVER_CLEAN của reference architecture
    # (bảng MERGE) là `int_weather_archive_hourly`, không phải model nào trong staging/.
    #
    # Vì sao staging là view MỎNG (rename/cast/WHERE, không window/join):
    # DuckDB không đẩy filter xuống dưới window function qua view (đo 9,7s vs
    # 0,0s). Dedup + `_row_hash` nằm ở intermediate TABLE incremental — chỗ duy
    # nhất nó rẻ.

    # 1 model / 1 nguồn. Rename + cast. Mặc định view -> không tốn dung lượng
    # (bản vật lý đã nằm ở catalog, autoloader ghi ngoài dbt cho weather).
    staging:
      +schema: silver
      +materialized: view
      +tags: ['staging']

    # Business logic trung gian: dedup, conform, change-aware MERGE.
    # Mặc định view; `int_weather_archive_hourly` override = incremental TABLE vì đó
    # là bảng MERGE, đẩy lên view sẽ tái tạo bug 49s.
    intermediate:
      +schema: silver
      +materialized: view
      +tags: ['intermediate']

    # Star schema. Mặc định table; fact/dim mutable ghi `incremental` trong
    # file để giữ cờ soft delete và `_updated_at` của dòng không đổi.
    marts:
      +schema: gold
      +materialized: table
      +tags: ['marts']
