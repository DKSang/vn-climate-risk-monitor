# Light report theme in the style of a Power BI canvas.
[theme]
base = "light"
primaryColor = "#2a78d6"
backgroundColor = "#f3f2f1"
secondaryBackgroundColor = "#ffffff"
textColor = "#252423"
borderColor = "#e1dfdd"
showWidgetBorder = true
baseRadius = "small"

[client]
toolbarMode = "viewer"
showSidebarNavigation = false

[browser]
gatherUsageStats = false
