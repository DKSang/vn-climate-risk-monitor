process_key: silver_weather
target: silver.int_weather_hourly
scope: production

sources:
  # Staging do autoloader ghi. `_ingested_at` là timestamp do PLATFORM sinh
  # (đồng hồ Postgres, engine inject), KHÔNG phải business time của Open-Meteo —
  # giờ của hệ nguồn có thể backdated, null, sai timezone; giờ ingest thì không.
  - ref: stg_weather_hourly
    change_column: _ingested_at

checkpoint:
  # Bù khoảng cách giữa lúc `_ingested_at` được đóng dấu (lúc lô bắt đầu ghi) và
  # lúc row thật sự visible sau COMMIT. Lô 50 file đo 0,4s nên 15 phút là biên
  # rất rộng; chi phí chỉ là rescan 15 phút staging.
  safety_lag: 15 minutes

runner:
  # staging (view mỏng) + intermediate (bảng MERGE). KHÔNG dùng `+tag:...`:
  # kéo cả seed vào mỗi lần chạy là thừa — seed do `make bootstrap-geography`
  # lo, và hai process tách nhau để lỗi ở Gold không buộc Silver dedup lại.
  select: "tag:staging tag:intermediate"
