process_key: silver_weather
target: silver.int_weather_archive_hourly
scope: production

sources:
  # _ingested_at is the platform ingestion clock, not source event time.
  - ref: stg_weather_archive_hourly
    change_column: _ingested_at

checkpoint:
  # Cover the gap between ingestion timestamp assignment and COMMIT visibility.
  safety_lag: 15 minutes

runner:
  # Seed loading is managed separately from the Silver process.
  select: "tag:staging tag:intermediate"
