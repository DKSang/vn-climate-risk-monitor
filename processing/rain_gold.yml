process_key: rain_gold
target: gold.fct_rain_hourly
scope: production

sources:
  # Đọc lớp CURATED (intermediate), không đọc staging. Watermark trên
  # `_updated_at` — cột chỉ nhích khi giá trị thật sự đổi (so `_row_hash`), nên
  # lần chạy không có dữ liệu mới không kéo theo bất kỳ dòng Gold nào.
  # Đổi ref từ `weather_hourly` (2026-09-03, tái cấu trúc 3 lớp) — checkpoint
  # cũ theo ref cũ thành dead row, lần chạy kế full refresh một lần.
  - ref: int_weather_hourly
    change_column: _updated_at

checkpoint:
  safety_lag: 15 minutes

runner:
  # Chỉ marts. KHÔNG dùng `+tag:marts` — kéo int_weather_hourly vào đây sẽ
  # chạy lại dedup với bounds của process SAI (source_ref stg_weather_hourly
  # không có trong bounds của rain_gold) và phá ranh giới hai process.
  select: "tag:marts"

# Danh mục phường CÓ THỂ bị xoá ở nguồn (sáp nhập/giải thể theo nghị quyết), và
# seed liệt kê được toàn bộ key nên anti-join chạy được. Weather thì không:
# Open-Meteo là REST không liệt kê được key, và quan trắc không bao giờ bị xoá.
soft_delete:
  - target: gold.dim_ward
    business_key: [ward_code]
    key_source_sql: |
      SELECT commune_code AS ward_code
      FROM catalog1.seed.ward_coordinates_seed
      WHERE province_code = '01'

  - target: gold.bridge_ward_grid
    business_key: [ward_code, weather_model]
    key_source_sql: |
      SELECT ward_code, model AS weather_model
      FROM catalog1.seed.ward_grid_map_seed
