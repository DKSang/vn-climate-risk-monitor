process_key: rain_gold
target: gold.fct_rain_archive_hourly
scope: production

sources:
  # _updated_at advances only when the curated row changes.
  - ref: int_weather_archive_hourly
    change_column: _updated_at

checkpoint:
  safety_lag: 15 minutes

runner:
  # Keep the archive serving graph explicit.
  select: "dim_grid dim_ward dim_flood_point bridge_ward_grid fct_flood_event_observation fct_rain_archive_hourly"

# Soft-delete only dimensions with complete source key sets.
soft_delete:
  - target: gold.dim_ward
    business_key: [ward_code]
    key_source_sql: |
      SELECT commune_code AS ward_code
      FROM catalog1.seed.ward_coordinates_seed
      WHERE province_code = '01'

  - target: gold.bridge_ward_grid
    business_key: [ward_code, weather_model]
    key_source_sql: |
      SELECT
        LPAD(CAST(ward_code AS VARCHAR), 5, '0') AS ward_code,
        model AS weather_model
      FROM catalog1.seed.ward_grid_map_seed
      UNION ALL
      -- Forecast keys are also materialized in bridge_ward_grid.
      SELECT commune_code AS ward_code, 'ecmwf_ifs_fc' AS weather_model
      FROM catalog1.seed.ward_coordinates_seed
      WHERE province_code = '01'
