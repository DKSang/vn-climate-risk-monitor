process_key: forecast_gold
target: gold.fct_rain_forecast_hourly
scope: production

sources:
  - ref: int_weather_forecast_hourly
    change_column: _updated_at

checkpoint:
  safety_lag: 15 minutes

runner:
  # Gold history incremental; selector + refresh cả current serving view và
  # các downstream table dùng latest run. Bridge được refresh để theo mesh
  # best_match của run mới nhất.
  select: "bridge_ward_grid fct_rain_forecast_hourly+"
