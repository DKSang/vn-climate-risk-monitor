name: open_meteo_ifs
dataset: historical_weather_hourly_ifs

discovery:
  prefix: bronze/files/open_meteo/historical_weather_hourly/ifs
  pattern: "**/response_*.json"

transform:
  sql_file: open_meteo_ifs.sql
  target: bronze_store.tables.open_meteo_ifs

# File archive ~600KB bung thành ~16k dòng; 50 file/lô đo 0,4s. Mỗi INSERT là
# một snapshot DuckLake, nên lô 50 giảm ~5 lần số snapshot so với mặc định 10.
loader:
  batch_size: 50
