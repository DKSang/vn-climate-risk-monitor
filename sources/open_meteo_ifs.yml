name: open_meteo_ifs
dataset: weather_hourly_ifs

discovery:
  prefix: bronze/files/open_meteo/historical_weather_hourly/ifs
  pattern: "**/response_*.json"

parameters:
  weather_model: ecmwf_ifs

transform:
  # Dùng CHUNG contract với open_meteo_archive — cùng bộ cột, chỉ khác model.
  sql_file: open_meteo_hourly.sql
  target: bronze_store.tables.open_meteo_hourly

loader:
  batch_size: 50
