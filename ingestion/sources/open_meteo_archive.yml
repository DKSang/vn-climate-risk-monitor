name: open_meteo_archive
dataset: historical_weather_hourly
scope: production

discovery:
  prefix: bronze/files/open_meteo/historical_weather_hourly
  pattern: "**/response_*.json"

transform:
  sql_file: open_meteo_archive.sql
  target: bronze_store.tables.open_meteo_archive

loader:
  batch_size: 10       # ~ cloudFiles.maxFilesPerTrigger
  lease_seconds: 300
  max_retries: 3
  max_batches: 100
