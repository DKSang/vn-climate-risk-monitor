# vn-climate-risk-monitor — Infrastructure
# Postgres: ingestion control plane + DuckLake catalog metadata
# MinIO:    S3-compatible object storage (Bronze/Silver/Gold Parquet)

services:
  postgres:
    image: postgres:17.5
    restart: unless-stopped
    ports:
      - "${POSTGRES_PORT:-5432}:5432"
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-vnclimate}
      POSTGRES_USER: ${POSTGRES_USER:-vnclimate}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-vnclimate}
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-vnclimate} -d ${POSTGRES_DB:-vnclimate}"]
      interval: 5s
      timeout: 5s
      retries: 10

  minio:
    image: minio/minio
    restart: unless-stopped
    ports:
      - "9000:9000"   # S3 API
      - "9001:9001"   # Console UI
    environment:
      MINIO_ROOT_USER: ${MINIO_ACCESS_KEY:-minioadmin}
      MINIO_ROOT_PASSWORD: ${MINIO_SECRET_KEY:-minioadmin}
    command: server --console-address ":9001" /data
    volumes:
      - minio_data:/data
    healthcheck:
      test: ["CMD", "mc", "ready", "local"]
      interval: 5s
      timeout: 5s
      retries: 10



  pgadmin:
    image: dpage/pgadmin4:latest
    restart: unless-stopped
    ports:
      - "${PGADMIN_PORT:-5050}:80"
    environment:
      PGADMIN_DEFAULT_EMAIL: ${PGADMIN_DEFAULT_EMAIL:-admin@vnclimate.org}
      PGADMIN_DEFAULT_PASSWORD: ${PGADMIN_DEFAULT_PASSWORD:-vnclimate}
      PGADMIN_CONFIG_SERVER_MODE: 'False'
      PGADMIN_SERVER_JSON_FILE: /tmp/servers.json
      PGADMIN_SERVERS_JSON: >-
        {"Servers":{"1":{"Name":"vnclimate (DuckLake Catalog)","Group":"Servers","Host":"postgres","Port":5432,"MaintenanceDB":"${POSTGRES_DB:-vnclimate}","Username":"${POSTGRES_USER:-vnclimate}","SSLMode":"prefer"}}}
    entrypoint:
      - /bin/sh
      - -ec
      - |
        printf '%s\n' "$$PGADMIN_SERVERS_JSON" > "$$PGADMIN_SERVER_JSON_FILE"
        exec /entrypoint.sh
    volumes:
      - pgadmin_data:/var/lib/pgadmin
    depends_on:
      postgres:
        condition: service_healthy

  airflow:
    image: apache/airflow:2.10.5-python3.12
    restart: unless-stopped
    depends_on:
      postgres:
        condition: service_healthy
      minio:
        condition: service_healthy
    ports:
      - "${AIRFLOW_PORT:-8080}:8080"
    environment:
      AIRFLOW__DATABASE__SQL_ALCHEMY_CONN: >-
        postgresql+psycopg2://${POSTGRES_USER:-vnclimate}:${POSTGRES_PASSWORD:-vnclimate}@postgres:5432/${POSTGRES_DB:-vnclimate}?options=-csearch_path%3Dairflow
      AIRFLOW__CORE__EXECUTOR: LocalExecutor
      AIRFLOW__CORE__LOAD_EXAMPLES: "false"
      AIRFLOW__CORE__DAGS_FOLDER: /opt/airflow/dags
      AIRFLOW__LOGGING__BASE_LOG_FOLDER: /opt/airflow/logs
      AIRFLOW__WEBSERVER__SECRET_KEY: ${AIRFLOW_SECRET_KEY:-vnclimate-airflow-secret-key-change-in-prod}
      AIRFLOW__WEBSERVER__EXPOSE_CONFIG: "true"
      # Project environment variables passed to worker
      POSTGRES_HOST: postgres
      POSTGRES_PORT: ${POSTGRES_PORT:-5432}
      POSTGRES_DB: ${POSTGRES_DB:-vnclimate}
      POSTGRES_USER: ${POSTGRES_USER:-vnclimate}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-vnclimate}
      MINIO_ENDPOINT: minio:9000
      MINIO_ACCESS_KEY: ${MINIO_ACCESS_KEY:-minioadmin}
      MINIO_SECRET_KEY: ${MINIO_SECRET_KEY:-minioadmin}
      MINIO_BUCKET: ${MINIO_BUCKET:-vn-climate}
      MINIO_SECURE: "false"
      OPEN_METEO_FETCH_WORKERS: ${OPEN_METEO_FETCH_WORKERS:-4}
      OPEN_METEO_FORECAST_URL: ${OPEN_METEO_FORECAST_URL:-https://api.open-meteo.com/v1/forecast}
      OPEN_METEO_ARCHIVE_URL: ${OPEN_METEO_ARCHIVE_URL:-https://archive-api.open-meteo.com/v1/archive}
      OPEN_METEO_FORECAST_MODEL: ${OPEN_METEO_FORECAST_MODEL:-best_match}
      OPEN_METEO_FORECAST_HOURS: ${OPEN_METEO_FORECAST_HOURS:-72}
      OPEN_METEO_LOCATION_BATCH_SIZE: ${OPEN_METEO_LOCATION_BATCH_SIZE:-25}
      DUCKLAKE_ALIAS: catalog1
      DUCKLAKE_DATA_PATH: s3://${MINIO_BUCKET:-vn-climate}
      DUCKLAKE_METADATA_SCHEMA: ducklake
      DUCKLAKE_DSN: "ducklake:postgres:dbname=${POSTGRES_DB:-vnclimate} host=postgres port=5432 user=${POSTGRES_USER:-vnclimate} password=${POSTGRES_PASSWORD:-vnclimate}"
      PROJECT_DIR: /project
      ALERT_WEBHOOK_URL: ${ALERT_WEBHOOK_URL:-}
      # Dùng venv riêng trong container để tránh đụng quyền với .venv của host (UID 1000 vs 50000)
      UV_PROJECT_ENVIRONMENT: /tmp/project_venv
    volumes:
      - ./orchestration/dags:/opt/airflow/dags:ro
      - .:/project
      - airflow_logs:/opt/airflow/logs
    command: standalone
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8080/health"]
      interval: 30s
      timeout: 10s
      retries: 5
      start_period: 60s

  dashboard:
    image: ghcr.io/astral-sh/uv:python3.13-bookworm-slim
    restart: unless-stopped
    ports:
      - "${DASHBOARD_PORT:-8501}:8501"
    working_dir: /project
    depends_on:
      postgres:
        condition: service_healthy
      minio:
        condition: service_healthy
    environment:
      POSTGRES_HOST: postgres
      POSTGRES_PORT: ${POSTGRES_PORT:-5432}
      POSTGRES_DB: ${POSTGRES_DB:-vnclimate}
      POSTGRES_USER: ${POSTGRES_USER:-vnclimate}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-vnclimate}
      MINIO_ENDPOINT: minio:9000
      MINIO_ACCESS_KEY: ${MINIO_ACCESS_KEY:-minioadmin}
      MINIO_SECRET_KEY: ${MINIO_SECRET_KEY:-minioadmin}
      MINIO_BUCKET: ${MINIO_BUCKET:-vn-climate}
      MINIO_SECURE: "false"
      DUCKLAKE_ALIAS: catalog1
      DUCKLAKE_DATA_PATH: s3://${MINIO_BUCKET:-vn-climate}
      DUCKLAKE_METADATA_SCHEMA: ducklake
      DASHBOARD_PORT: ${DASHBOARD_PORT:-8501}
    volumes:
      - .:/project
    command: >
      sh -c "uv sync --frozen &&
             uv run streamlit run serving/dashboard/app.py
             --server.port ${DASHBOARD_PORT:-8501}
             --server.address 0.0.0.0"

volumes:
  postgres_data:
  minio_data:
  pgadmin_data:
  airflow_logs:
