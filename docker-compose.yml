# Local single-node stack: `docker compose up -d --build` (settings in .env).
name: vn-climate-risk-monitor

# How the pipeline and the dashboard reach Postgres and MinIO inside the network.
x-lakehouse-env: &lakehouse-env
  POSTGRES_HOST: postgres
  POSTGRES_PORT: 5432
  POSTGRES_DB: ${POSTGRES_DB:-vnclimate}
  POSTGRES_USER: ${POSTGRES_USER:-vnclimate}
  POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?Set POSTGRES_PASSWORD in .env}
  MINIO_ENDPOINT: minio:9000
  MINIO_ACCESS_KEY: ${MINIO_ACCESS_KEY:?Set MINIO_ACCESS_KEY in .env}
  MINIO_SECRET_KEY: ${MINIO_SECRET_KEY:?Set MINIO_SECRET_KEY in .env}
  MINIO_BUCKET: ${MINIO_BUCKET:-vn-climate}
  MINIO_SECURE: "false"

x-healthcheck: &healthcheck
  interval: 10s
  timeout: 5s
  retries: 10

services:
  postgres:
    image: postgres:17.5@sha256:aadf2c0696f5ef357aa7a68da995137f0cf17bad0bf6e1f17de06ae5c769b302
    restart: unless-stopped
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-vnclimate}
      POSTGRES_USER: ${POSTGRES_USER:-vnclimate}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?Set POSTGRES_PASSWORD in .env}
    ports:
      - "127.0.0.1:${POSTGRES_PORT:-5432}:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
      - ./docker/postgres/init.sql:/docker-entrypoint-initdb.d/init.sql:ro
    healthcheck:
      <<: *healthcheck
      test: ["CMD-SHELL", "pg_isready -U $${POSTGRES_USER} -d $${POSTGRES_DB}"]

  minio:
    # MinIO no longer publishes images; Chainguard builds it from source.
    image: cgr.dev/chainguard/minio:latest@sha256:bd014394a80898e68c149f2311fdf8d5a2c2f3bb2c33b9327ae6d02b4b065ae1
    restart: unless-stopped
    command: ["server", "/data", "--console-address", ":9001"]
    environment:
      MINIO_ROOT_USER: ${MINIO_ACCESS_KEY:?Set MINIO_ACCESS_KEY in .env}
      MINIO_ROOT_PASSWORD: ${MINIO_SECRET_KEY:?Set MINIO_SECRET_KEY in .env}
    ports:
      - "127.0.0.1:${MINIO_API_PORT:-9000}:9000"
      - "127.0.0.1:${MINIO_CONSOLE_PORT:-9001}:9001"
    volumes:
      - minio_data:/data
    healthcheck:
      <<: *healthcheck
      test: ["CMD", "mc", "ready", "local"]

  airflow:
    build:
      context: .
      dockerfile: docker/airflow.Dockerfile
    restart: unless-stopped
    command: ["bash", "/project/docker/airflow-entrypoint.sh"]
    depends_on:
      postgres:
        condition: service_healthy
      minio:
        condition: service_healthy
    environment:
      <<: *lakehouse-env
      OPEN_METEO_FORECAST_URL: ${OPEN_METEO_FORECAST_URL:-https://api.open-meteo.com/v1/forecast}
      OPEN_METEO_ARCHIVE_URL: ${OPEN_METEO_ARCHIVE_URL:-https://archive-api.open-meteo.com/v1/archive}
      OPEN_METEO_FORECAST_HOURS: ${OPEN_METEO_FORECAST_HOURS:-72}
      OPEN_METEO_LOCATION_BATCH_SIZE: ${OPEN_METEO_LOCATION_BATCH_SIZE:-25}
      PROJECT_DIR: /project
      AIRFLOW_USERNAME: ${AIRFLOW_USERNAME:-admin}
      AIRFLOW_PASSWORD: ${AIRFLOW_PASSWORD:?Set AIRFLOW_PASSWORD in .env}
      # Airflow metadata lives in the `airflow` schema of the same Postgres.
      AIRFLOW__DATABASE__SQL_ALCHEMY_CONN_CMD: python /project/scripts/airflow_sql_alchemy_conn.py
      AIRFLOW__CORE__EXECUTOR: LocalExecutor
      AIRFLOW__CORE__LOAD_EXAMPLES: "false"
      AIRFLOW__CORE__DAGS_ARE_PAUSED_AT_CREATION: ${AIRFLOW_DAGS_PAUSED_AT_CREATION:-true}
      AIRFLOW__WEBSERVER__SECRET_KEY: ${AIRFLOW_PASSWORD:?Set AIRFLOW_PASSWORD in .env}
      AIRFLOW__WEBSERVER__EXPOSE_CONFIG: "false"
    ports:
      - "127.0.0.1:${AIRFLOW_PORT:-8080}:8080"
    volumes:
      - airflow_logs:/opt/airflow/logs
    healthcheck:
      <<: *healthcheck
      # /health answers 200 even when the scheduler is down, so read its body.
      test:
        - CMD
        - python
        - -c
        - |
          import json, urllib.request
          health = json.load(urllib.request.urlopen("http://localhost:8080/health"))
          assert health["metadatabase"]["status"] == health["scheduler"]["status"] == "healthy"
      interval: 30s
      start_period: 90s

  dashboard:
    build:
      context: .
      dockerfile: docker/dashboard.Dockerfile
    restart: unless-stopped
    depends_on:
      postgres:
        condition: service_healthy
      minio:
        condition: service_healthy
    environment:
      <<: *lakehouse-env
    ports:
      - "127.0.0.1:${DASHBOARD_PORT:-8501}:8501"
    healthcheck:
      <<: *healthcheck
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://localhost:8501/_stcore/health')"]
      start_period: 30s

volumes:
  postgres_data:
  minio_data:
  airflow_logs:
