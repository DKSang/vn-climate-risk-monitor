# vn-climate-risk-monitor — local single-node runtime

x-project-environment: &project-environment
  POSTGRES_HOST: postgres
  POSTGRES_PORT: 5432
  POSTGRES_DB: ${POSTGRES_DB:-vnclimate}
  POSTGRES_USER: ${POSTGRES_USER:-vnclimate}
  POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?Set POSTGRES_PASSWORD in .env}
  MINIO_ENDPOINT: minio:9000
  MINIO_ACCESS_KEY: ${MINIO_ACCESS_KEY:?Set MINIO_ACCESS_KEY in .env}
  MINIO_SECRET_KEY: ${MINIO_SECRET_KEY:?Set MINIO_SECRET_KEY in .env}
  MINIO_BUCKET: ${MINIO_BUCKET:-vn-climate}
  MINIO_SECURE: "false"

services:
  postgres:
    image: postgres:17.5@sha256:aadf2c0696f5ef357aa7a68da995137f0cf17bad0bf6e1f17de06ae5c769b302
    restart: unless-stopped
    ports:
      - "127.0.0.1:${POSTGRES_PORT:-5432}:5432"
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-vnclimate}
      POSTGRES_USER: ${POSTGRES_USER:-vnclimate}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?Set POSTGRES_PASSWORD in .env}
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-vnclimate} -d ${POSTGRES_DB:-vnclimate}"]
      interval: 5s
      timeout: 5s
      retries: 10

  minio:
    image: minio/minio:RELEASE.2025-09-07T16-13-09Z@sha256:14cea493d9a34af32f524e538b8346cf79f3321eff8e708c1e2960462bd8936e
    restart: unless-stopped
    ports:
      - "127.0.0.1:${MINIO_API_PORT:-9000}:9000"
      - "127.0.0.1:${MINIO_CONSOLE_PORT:-9001}:9001"
    environment:
      MINIO_ROOT_USER: ${MINIO_ACCESS_KEY:?Set MINIO_ACCESS_KEY in .env}
      MINIO_ROOT_PASSWORD: ${MINIO_SECRET_KEY:?Set MINIO_SECRET_KEY in .env}
    command: ["server", "--console-address", ":9001", "/data"]
    volumes:
      - minio_data:/data
    healthcheck:
      test: ["CMD", "mc", "ready", "local"]
      interval: 5s
      timeout: 5s
      retries: 10

  bootstrap:
    build:
      context: .
      dockerfile: docker/dashboard.Dockerfile
    image: vn-climate-risk-monitor-dashboard:0.1.0
    depends_on:
      postgres:
        condition: service_healthy
      minio:
        condition: service_healthy
    environment:
      <<: *project-environment
    command:
      - bash
      - -ec
      - |
        uv run bootstrap-lakehouse
        uv run dbt seed --project-dir transform --profiles-dir transform
        uv run dbt build --project-dir transform --profiles-dir transform --indirect-selection cautious --select stg_seed__ward stg_seed__ward_grid dim_ward

  airflow:
    build:
      context: .
      dockerfile: docker/airflow.Dockerfile
    image: vn-climate-risk-monitor-airflow:2.10.5
    restart: unless-stopped
    dns:
      - 1.1.1.1
      - 8.8.8.8
    depends_on:
      postgres:
        condition: service_healthy
      minio:
        condition: service_healthy
      bootstrap:
        condition: service_completed_successfully
    ports:
      - "127.0.0.1:${AIRFLOW_PORT:-8080}:8080"
    environment:
      <<: *project-environment
      AIRFLOW__DATABASE__SQL_ALCHEMY_CONN_CMD: >-
        python /project/scripts/airflow_sql_alchemy_conn.py
      AIRFLOW__CORE__EXECUTOR: LocalExecutor
      AIRFLOW__CORE__LOAD_EXAMPLES: "false"
      AIRFLOW__CORE__DAGS_ARE_PAUSED_AT_CREATION: ${AIRFLOW_DAGS_PAUSED_AT_CREATION:-true}
      AIRFLOW_USERNAME: ${AIRFLOW_USERNAME:-admin}
      AIRFLOW_PASSWORD: ${AIRFLOW_PASSWORD:?Set AIRFLOW_PASSWORD in .env}
      AIRFLOW__WEBSERVER__SECRET_KEY: ${AIRFLOW_PASSWORD:?Set AIRFLOW_PASSWORD in .env}
      AIRFLOW__WEBSERVER__EXPOSE_CONFIG: "false"
      OPEN_METEO_FETCH_WORKERS: ${OPEN_METEO_FETCH_WORKERS:-4}
      OPEN_METEO_FORECAST_URL: ${OPEN_METEO_FORECAST_URL:-https://api.open-meteo.com/v1/forecast}
      OPEN_METEO_ARCHIVE_URL: ${OPEN_METEO_ARCHIVE_URL:-https://archive-api.open-meteo.com/v1/archive}
      OPEN_METEO_FORECAST_MODEL: ${OPEN_METEO_FORECAST_MODEL:-best_match}
      OPEN_METEO_FORECAST_HOURS: ${OPEN_METEO_FORECAST_HOURS:-72}
      OPEN_METEO_LOCATION_BATCH_SIZE: ${OPEN_METEO_LOCATION_BATCH_SIZE:-25}
      PROJECT_DIR: /project
      ALERT_WEBHOOK_URL: ${ALERT_WEBHOOK_URL:-}
    volumes:
      - airflow_logs:/opt/airflow/logs
    command:
      - bash
      - -ec
      - |
        export AIRFLOW__CORE__FERNET_KEY="$$(python -c 'import base64, hashlib, os; print(base64.urlsafe_b64encode(hashlib.sha256(os.environ["AIRFLOW_PASSWORD"].encode()).digest()).decode())')"
        airflow db migrate
        airflow users create \
          --username "$${AIRFLOW_USERNAME}" \
          --password "$${AIRFLOW_PASSWORD}" \
          --firstname "VN" --lastname "Climate" --role Admin \
          --email "$${AIRFLOW_USERNAME}@localhost" || true
        airflow users reset-password \
          --username "$${AIRFLOW_USERNAME}" \
          --password "$${AIRFLOW_PASSWORD}"
        airflow pools set lakehouse_single_writer_pool 1 \
          "Single-writer lock for DuckLake and Open-Meteo quota"
        # Docker/host shutdown can leave this runtime-only file behind in the
        # container writable layer. Remove it before standalone reuses PIDs.
        rm -f /opt/airflow/airflow-webserver.pid
        exec airflow standalone
    healthcheck:
      test:
        - CMD-SHELL
        - >-
          export AIRFLOW__CORE__FERNET_KEY="$$(python -c 'import base64, hashlib, os; print(base64.urlsafe_b64encode(hashlib.sha256(os.environ["AIRFLOW_PASSWORD"].encode()).digest()).decode())')"
          &&
          airflow jobs check --job-type SchedulerJob --allow-multiple --limit 100
          && curl --fail --silent http://localhost:8080/health >/dev/null
      interval: 30s
      timeout: 10s
      retries: 5
      start_period: 60s

  streamlit:
    build:
      context: .
      dockerfile: docker/dashboard.Dockerfile
    image: vn-climate-risk-monitor-dashboard:0.1.0
    restart: unless-stopped
    ports:
      - "127.0.0.1:${DASHBOARD_PORT:-8501}:8501"
    depends_on:
      postgres:
        condition: service_healthy
      minio:
        condition: service_healthy
      bootstrap:
        condition: service_completed_successfully
    environment:
      <<: *project-environment
      DASHBOARD_PORT: ${DASHBOARD_PORT:-8501}

volumes:
  postgres_data:
  minio_data:
  airflow_logs:
