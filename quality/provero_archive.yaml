# Validate the DuckLake archive staging table after autoload.
# Query the catalog so snapshot deletes are respected.

source:
  type: ducklake
  table: catalog1.silver.stg_weather_archive_hourly

checks:
  - row_count:
      min: 1
  - not_null: [grid_latitude, grid_longitude, valid_time_utc, weather_model]
  - range:
      column: precipitation_mm
      min: 0
      max: 500
  - accepted_values:
      column: weather_model
      values: ['era5', 'ecmwf_ifs']
