# Kiểm tra chất lượng Silver staging archive — chạy NGAY SAU
# `make load`, chỗ dbt không với tới (autoloader ghi staging ngoài đồ thị dbt).
#
# type: ducklake -> connector riêng trong autoloader/provero_ducklake.py, ATTACH
# catalog trước khi query. KHÔNG glob Parquet: glob đọc cả dòng đã xoá và file
# của snapshot cũ.

source:
  type: ducklake
  table: catalog1.silver.stg_weather_archive_hourly

checks:
  - row_count:
      min: 1
  - not_null: [grid_latitude, grid_longitude, valid_time_utc, weather_model]
  - range:
      column: precipitation_mm
      min: 0
      max: 500
  - accepted_values:
      column: weather_model
      values: ['era5', 'ecmwf_ifs']
