# Validate the DuckLake staging table after autoload.
# Query the catalog so snapshot deletes are respected.

source:
  type: ducklake
  table: catalog1.silver.stg_weather_forecast

checks:
  - row_count:
      min: 1
  - not_null: [grid_latitude, grid_longitude, valid_time_utc]
  - range:
      column: precipitation_mm
      min: 0
      max: 500
  - freshness:
      column: _ingested_at
      max_age: 24h
