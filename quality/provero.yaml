# Kiểm tra chất lượng bronze — chạy NGAY SAU `make load`, chỗ dbt không với tới
# (autoloader ghi bronze ngoài đồ thị dbt).
#
# type: ducklake -> connector riêng trong autoloader/provero_ducklake.py, ATTACH
# catalog trước khi query. KHÔNG glob Parquet: glob đọc cả dòng đã xoá và file
# của snapshot cũ (đã đo: lệch 82 dòng sau một lệnh DELETE).

source:
  type: ducklake
  connection: "ducklake:postgres:dbname=vnclimate host=127.0.0.1 port=5432 user=vnclimate password=vnclimate"
  table: catalog1.silver.stg_weather_forecast

checks:
  - row_count:
      min: 1
  - not_null: [grid_latitude, grid_longitude, valid_time_utc]
  - range:
      column: precipitation_mm
      min: 0
      max: 500
  - freshness:
      column: _ingested_at
      max_age: 24h
