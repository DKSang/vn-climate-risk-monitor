[project]
name = "vn-climate-risk-monitor"
version = "0.1.0"
description = "End-to-end Hanoi climate data pipeline with Open-Meteo, DuckLake, dbt, Airflow and Streamlit"
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
    # ── Lakehouse (DuckDB compute + MinIO storage) ──
    "duckdb>=1.5.5",
    "minio>=7.2.0",
    "psycopg[binary]>=3.2.0",
    # ── Transform (dbt + DuckDB) ──
    "dbt-duckdb>=1.11.0",
    # ── Runtime configuration ──
    "python-dotenv>=1.1.0",
    # ── Serving / Dashboard (Streamlit + deck.gl) ──
    "streamlit>=1.45.0",
    "pydeck>=0.9.1",
    "pandas>=2.2.0",
    "altair>=5.0.0",
    "provero==0.2.1",
]

[dependency-groups]
dev = [
    "pytest>=8.3.0",
    # Render macro dbt trong unit test, không cần DuckDB/Postgres chạy thật.
    "jinja2>=3.1.0",
    "ruff>=0.11.0",
]

[project.scripts]
fetch-open-meteo = "vn_climate_risk_monitor.sources.open_meteo.cli:main"
auto-loader = "vn_climate_risk_monitor.auto_loader.cli:main"
auto-process = "vn_climate_risk_monitor.auto_process.cli:main"
pipeline-health = "vn_climate_risk_monitor.quality.health:main"
quality-gate = "vn_climate_risk_monitor.quality.gates:main"
maintain-lakehouse = "vn_climate_risk_monitor.operations.maintenance:main"
bootstrap-lakehouse = "vn_climate_risk_monitor.operations.bootstrap:main"
reset-lakehouse = "vn_climate_risk_monitor.operations.reset:main"

[tool.uv.build-backend]
# One product package; lifecycle stages are internal capabilities.
module-name = ["vn_climate_risk_monitor"]

[build-system]
requires = ["uv_build>=0.12.3,<0.13.0"]
build-backend = "uv_build"
