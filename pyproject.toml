[project]
name = "vn-climate-risk-monitor"
version = "0.1.0"
description = "Hanoi Flood & Climate Risk Monitor — DuckLake lakehouse + medallion architecture"
readme = "README.md"
authors = [
    { name = "Antigravity", email = "antigravity@bmad-method.org" }
]
requires-python = ">=3.13"
dependencies = [
    # ── Ingest (small explicit Python stack) ──
    "requests>=2.32.0",
    "urllib3>=2.2.0",
    "pyarrow>=19.0.0",

    # ── Lakehouse (DuckDB compute + MinIO storage) ──
    "duckdb>=1.5.5",
    "minio>=7.2.0",
    "psycopg[binary]>=3.2.0",

    # ── Transform (dbt + DuckDB) ──
    "dbt-duckdb>=1.11.0",

    # ── Runtime configuration ──
    "python-dotenv>=1.1.0",
]

[dependency-groups]
dev = [
    "pytest>=8.3.0",
    "responses>=0.25.0",
    "ruff>=0.11.0",
]

[project.scripts]
vn-climate-risk-monitor = "vn_climate_risk_monitor:main"
collect-administrative-reference = "vn_climate_risk_monitor.ingestion.collectors.administrative_reference:main"
collect-open-meteo-forecast = "vn_climate_risk_monitor.ingestion.collectors.open_meteo_forecast:main"
collect-open-meteo-archive = "vn_climate_risk_monitor.ingestion.collectors.open_meteo_archive:main"
load-open-meteo-forecast = "vn_climate_risk_monitor.ingestion.loaders.open_meteo_forecast_hourly:main"
load-open-meteo-archive = "vn_climate_risk_monitor.ingestion.loaders.open_meteo_archive_hourly:main"
run-open-meteo-pipeline = "vn_climate_risk_monitor.ingestion.pipelines.open_meteo_forecast:main"
plan-open-meteo-archive = "vn_climate_risk_monitor.ingestion.pipelines.open_meteo_archive:main"
run-open-meteo-archive = "vn_climate_risk_monitor.ingestion.pipelines.open_meteo_archive:main"
observe-open-meteo-ingestion = "vn_climate_risk_monitor.ingestion.observability:main"
observe-ingestion = "vn_climate_risk_monitor.ingestion.observability:main"

[build-system]
requires = ["uv_build>=0.12.3,<0.13.0"]
build-backend = "uv_build"
