[project]
name = "vn-climate-risk-monitor"
version = "0.1.0"
description = "Hanoi Flood & Climate Risk Monitor — DuckLake lakehouse + medallion architecture"
readme = "README.md"
authors = [
    { name = "Antigravity", email = "antigravity@bmad-method.org" }
]
requires-python = ">=3.12"
dependencies = [
    # ── Lakehouse (DuckDB compute + MinIO storage) ──
    "duckdb>=1.5.5",
    "minio>=7.2.0",
    "psycopg[binary]>=3.2.0",

    # ── Transform (dbt + DuckDB) ──
    "dbt-duckdb>=1.11.0",

    # ── Runtime configuration ──
    "python-dotenv>=1.1.0",

    # ── Serving / Dashboard (Streamlit + deck.gl) ──
    "streamlit>=1.45.0",
    "pydeck>=0.9.1",
    "pandas>=2.2.0",
    "altair>=5.0.0",
]

[dependency-groups]
dev = [
    "pytest>=8.3.0",
    # Render macro dbt trong unit test, không cần DuckDB/Postgres chạy thật.
    "jinja2>=3.1.0",
    "ruff>=0.11.0",
]

[project.scripts]
fetch-open-meteo = "vn_climate_risk_monitor.open_meteo:main"
auto-loader = "vn_climate_risk_monitor.load:main"
auto-process = "vn_climate_risk_monitor.processing.cli:main"
pipeline-health = "vn_climate_risk_monitor.health:main"
maintain-lakehouse = "vn_climate_risk_monitor.maintenance:main"
bootstrap-lakehouse = "vn_climate_risk_monitor.bootstrap:main"
reset-lakehouse = "vn_climate_risk_monitor.reset:main"

[tool.uv.build-backend]
# One product package; ingestion and processing are internal capabilities.
module-name = ["vn_climate_risk_monitor"]

[build-system]
requires = ["uv_build>=0.12.3,<0.13.0"]
build-backend = "uv_build"
