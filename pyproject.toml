[project]
name = "vn-climate-risk-monitor"
version = "0.1.0"
description = "Hanoi Flood & Climate Risk Monitor — DuckLake lakehouse + medallion architecture"
readme = "README.md"
authors = [
    { name = "Antigravity", email = "antigravity@bmad-method.org" }
]
requires-python = ">=3.13"
dependencies = [
    # ── Lakehouse (DuckDB compute + MinIO storage) ──
    "duckdb>=1.5.5",
    "minio>=7.2.0",
    "psycopg[binary]>=3.2.0",

    # ── Transform (dbt + DuckDB) ──
    "dbt-duckdb>=1.11.0",

    # ── Runtime configuration ──
    "python-dotenv>=1.1.0",
]

[dependency-groups]
dev = [
    "provero>=0.2.1",
    "pytest>=8.3.0",
    "responses>=0.25.0",
    "ruff>=0.11.0",
]

[project.scripts]
fetch-open-meteo = "vn_climate_risk_monitor.open_meteo:main"
load-sources = "vn_climate_risk_monitor.load:main"

# Connector DuckLake cho Provero — Provero tự phát hiện qua entry_points.
# Không cần fork Provero, không ghi đè connector built-in.
[project.entry-points."provero.connectors"]
ducklake = "autoloader.provero_ducklake:DuckLakeConnector"

[tool.uv.build-backend]
# `fetch` = HTTP→MinIO; `autoloader` = file→bảng; `vn_climate_risk_monitor` = app.
module-name = ["fetch", "autoloader", "vn_climate_risk_monitor"]

[build-system]
requires = ["uv_build>=0.12.3,<0.13.0"]
build-backend = "uv_build"
