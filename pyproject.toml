[project]
name = "vn-climate-risk-monitor"
version = "0.1.0"
description = "Hanoi Flood & Climate Risk Monitor — DuckLake lakehouse + medallion architecture"
readme = "README.md"
authors = [
    { name = "Antigravity", email = "antigravity@bmad-method.org" }
]
requires-python = ">=3.13"
dependencies = [
    # ── Ingest (small explicit Python stack) ──
    "requests>=2.32.0",
    "urllib3>=2.2.0",
    "pyarrow>=19.0.0",

    # ── Lakehouse (DuckDB compute + MinIO storage) ──
    "duckdb>=1.5.5",
    "minio>=7.2.0",
    "psycopg[binary]>=3.2.0",

    # ── Transform (dbt + DuckDB) ──
    "dbt-duckdb>=1.11.0",

    # ── Runtime configuration ──
    "python-dotenv>=1.1.0",
]

[dependency-groups]
dev = [
    "provero>=0.2.1",
    "pytest>=8.3.0",
    "responses>=0.25.0",
    "ruff>=0.11.0",
]

[project.scripts]
collect-administrative-reference = "vn_climate_risk_monitor.ingestion.collectors.administrative_reference:main"
fetch-open-meteo = "vn_climate_risk_monitor.ingestion.fetch:main"
load-sources = "vn_climate_risk_monitor.ingestion.run:main"

# Connector DuckLake cho Provero — Provero tự phát hiện qua entry_points.
# Không cần fork Provero, không ghi đè connector built-in.
[project.entry-points."provero.connectors"]
ducklake = "autoloader.provero_ducklake:DuckLakeConnector"

[tool.uv.build-backend]
# Hai package trong src/: `autoloader` là thư viện generic tái sử dụng được cho
# dự án khác; `vn_climate_risk_monitor` là code riêng của dự án này.
module-name = ["autoloader", "vn_climate_risk_monitor"]

[build-system]
requires = ["uv_build>=0.12.3,<0.13.0"]
build-backend = "uv_build"
