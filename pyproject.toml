[project]
name = "vn-climate-risk-monitor"
version = "0.1.0"
description = "End-to-end Hanoi climate data pipeline with Open-Meteo, DuckLake, dbt, Airflow and Streamlit"
readme = "README.md"
requires-python = ">=3.12,<3.14"
dependencies = [
    # ── Lakehouse (DuckDB compute + MinIO storage) ──
    "duckdb>=1.5.5",
    "minio>=7.2.0",
    "psycopg[binary]>=3.2.0",
    # ── Transform (dbt + DuckDB) ──
    "dbt-duckdb>=1.11.0",
    # ── Runtime configuration ──
    "python-dotenv>=1.1.0",
    # ── Serving / Dashboard (Streamlit + deck.gl) ──
    "streamlit>=1.45.0",
    "pydeck>=0.9.1",
    "pandas>=2.2.0",
    "altair>=5.0.0",
    "requests>=2.32",
    "tenacity>=9.0",
    "great-expectations>=1.23",
]

[dependency-groups]
dev = [
    "pytest>=8.3.0",
    # Render macro dbt trong unit test, không cần DuckDB/Postgres chạy thật.
    "jinja2>=3.1.0",
    "ruff>=0.11.0",
    "responses>=0.25",
]

[project.scripts]
init-lakehouse = "pipeline.init:main"
maintain-lakehouse = "pipeline.maintain:main"
fetch-forecast = "pipeline.open_meteo.forecast:main"
load-forecast = "pipeline.open_meteo.load:main"
build-clean-forecast = "pipeline.open_meteo.clean:main"
build-gold-forecast = "pipeline.open_meteo.gold:main"

[tool.uv.build-backend]
# Flat layout: the only Python package is ./pipeline.
module-name = "pipeline"
module-root = ""

[build-system]
requires = ["uv_build>=0.12.3,<0.13.0"]
build-backend = "uv_build"
