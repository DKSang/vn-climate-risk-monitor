[project]
name = "vn-climate-risk-monitor"
version = "0.1.0"
description = "Hanoi Flood & Climate Risk Monitor — DuckLake lakehouse + medallion architecture"
readme = "README.md"
authors = [
    { name = "Antigravity", email = "antigravity@bmad-method.org" }
]
requires-python = ">=3.13"
dependencies = [
    # ── Ingest (dlt + HTTP client) ──
    "dlt[duckdb,filesystem,sql-database,postgres]>=1.30.0",
    "httpx>=0.28.0",
    "pyarrow>=19.0.0",
    "s3fs>=2025.3.0",

    # ── Lakehouse (DuckDB compute + MinIO storage) ──
    "duckdb>=1.5.5",
    "minio>=7.2.0",

    # ── Transform (dbt + DuckDB) ──
    "dbt-duckdb>=1.11.0",

    # ── Serve (FastAPI + Streamlit) ──
    "fastapi>=0.115.0",
    "uvicorn[standard]>=0.34.0",
    "streamlit>=1.45.0",

    # ── Utilities ──
    "pandas>=2.2.0",
    "pendulum>=3.0.0",
    "python-dotenv>=1.1.0",
]

[dependency-groups]
dev = [
    "pytest>=8.3.0",
    "pytest-asyncio>=1.0.0",
    "ruff>=0.11.0",
]

[project.scripts]
vn-climate-risk-monitor = "vn_climate_risk_monitor:main"
collect-administrative-reference = "vn_climate_risk_monitor.ingestion.collectors.administrative_reference:main"

[build-system]
requires = ["uv_build>=0.12.3,<0.13.0"]
build-backend = "uv_build"
